    - { label: Floor load, value: "{cryo-floor-load} at first, {cryo-floor-load-century} within a century" }
    - { label: Refrigeration, value: "{cryo-refrigeration-share} of the Lattice at first" }
    - { label: Compartments, value: "{cryo-cells} cells of {cryo-cell-area}, at most {cryo-cell-co2} each" }
    - { label: A torn cell, value: "Releases at most {cryo-cell-co2}, {cryo-cell-release-ppm} of the air; resealed within {cryo-reseal-time}" }
    - { label: Sealing, value: "{sealing-window} from the seas frozen through ({traj-frozen|date=day}) to the last cap ({sealing-end|date=day}): {cap-laying-rate} of cap" }
    - { label: If refrigeration stops, value: "The floor heat melts the base into a liquid layer under the cap, {cryo-base-melt-rate} of ice a year at first: {cryo-unrefrigerated-loss} of the CO₂" }
