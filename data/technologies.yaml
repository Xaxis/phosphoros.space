# The thirteen inventions. Each has a page on the site and a document in docs/technologies/.
# This file holds the structured parts: the one-line summary, the specs table and what is invented
# or borrowed. Prose (principle, design, build sequence, failure modes) lives in the document.
#
#   place:   where it works: earth | mercury | space | ceres | venus | everywhere
#   online:  a date id from the model, or text
#   specs:   rows of { label, value } where value is text with {id} references
#   invented: what does not exist yet, in a phrase
#   precedent: what does, with its source
#   modules: the calc/src/model files that compute its numbers
#   corrections: the version 3 corrections that changed it; open: its open problems
#   figures: the figures that show it
#   machines: for a self-copying factory, its machine types in loop order: name, makes (a short
#     label for the figure), does (the full description for the table) and feeds

- id: ouroboros
  name: Ouroboros Foundry
  place: mercury
  online: foundry-landing
  summary: >-
    A {foundry-seed-mass} seed of twelve machine types rebuilds itself from Mercury rock every
    {foundry-doubling-days} and reaches {foundry-final-mass} of machinery by {foundry-full-scale}.
  job: Self-copying industry on Mercury
  scale: "{foundry-seed-mass} seed to {foundry-final-mass}"
  breakthrough: A fully closed loop (chips, motors, optics, robots) from regolith, doubling every {foundry-doubling-days}
  specs:
    - { label: Seed mass, value: "{foundry-seed-mass}, launched {foundry-seed-launch|date=day}, landed {foundry-landing|date=day}" }
    - { label: Doubling time, value: "{foundry-doubling-days}" }
    - { label: Doublings to full scale, value: "{foundry-doublings}, giving {foundry-final-mass}" }
    - { label: Full scale, value: "{foundry-full-scale|date=day}" }
    - { label: Energy per kilogram built, value: "{foundry-energy-per-kg}" }
    - { label: Power per kilogram of machinery, value: "{foundry-power-per-kg}" }
    - { label: Peak power, value: "{foundry-peak-power}, from its own film" }
    - { label: Share of Mercury used, value: "{foundry-mercury-share} of its mass" }
    - { label: Mercury's escape speed, value: "{mercury-escape}, so parts reach orbit by mass driver" }
    - { label: Machinery in January 2030, value: "{foundry-mass-2030}" }
    - { label: Machinery in January 2032, value: "{foundry-mass-2032}" }
    - { label: Material closure, value: "{foundry-closure-seed} at seed; complete once trace-element refining runs, from {foundry-trace-refining|date=year}" }
    - { label: Mercury's surface rock, value: "Rich in sulfur, carbon and magnesium; poor in aluminium, calcium and iron, under {mercury-surface-fe-max} by mass" }
  invented:
    - Lithocell chip fabs that write circuits with a million parallel electron beams, no masks
    - A {foundry-doubling-days} doubling time for a factory that makes everything, including its chips
  precedent:
    - text: The 1980 NASA/ASEE summer study designed a self-replicating lunar factory from a {lunar-factory-seed-mass} seed that copies itself in about {lunar-factory-replication-time}.
      source: nasa-cp-2255
  experiments: [ouroboros-0]
  figures: [foundry-growth, foundry-loop]
  modules: [foundry.ts]
  corrections: [mercury-iron]
  # In loop order: each feeds the next, except that the mass drivers' parts leave for orbit, and
  # the Assemblers close the loop by building every type.
  machines:
    - name: Diggers
      makes: Sorted regolith
      does: "Mine and sort regolith"
      feeds: Smelters
    - name: Smelters
      makes: Metals and oxygen
      does: "Solar furnaces and molten-regolith electrolysis, splitting rock into oxygen, iron, silicon, aluminum, titanium and magnesium"
      feeds: Every other line
    - name: Glass furnaces
      makes: Glass and optics
      does: "Glass, fiber and optics"
      feeds: "Film lines, Lithocells, laser emitters"
    - name: Film lines
      makes: Solar film
      does: "Thin solar film at {helios-areal-density}, the Foundry's own power and the stuff of the Lattice and the Veil"
      feeds: "Power for the loop; Petals and slats"
    - name: Lithocells
      makes: Chips
      does: "Chip fabs that write circuits directly with electron beams"
      feeds: Every machine's controller
    - name: Choir nodes
      makes: Compute and links
      does: "Compute and communications for the Choir control system"
      feeds: "Coordination, the Mass Ledger"
    - name: Coil lines
      makes: Motors
      does: "Aluminum wire and iron cores for induction and reluctance motors, with no rare earths"
      feeds: Everything that moves
    - name: Rolling mills
      makes: "Sheet, beam and rail"
      does: "Sheet, beam and rail"
      feeds: "Assemblers, mass drivers, Petal and slat frames"
    - name: Mass drivers
      makes: Parts to orbit
      does: "Throw finished parts to orbit"
      feeds: "The Lattice, the Veil, the Ring"
    - name: Haulers
      makes: Site transport
      does: "Move ore, parts and products across the site"
      feeds: The whole loop
    - name: Printers
      makes: Complex metal parts
      does: "Electron-beam additive manufacturing in vacuum, for complex metal parts"
      feeds: "Assemblers, bearings, housings"
    - name: Assemblers
      makes: Every machine type
      does: "Robot arms that build every machine type, including Assemblers"
      feeds: The whole loop

- id: helios
  name: Helios Lattice
  place: mercury
  online: helios-full-power
  summary: >-
    {helios-petals} film Petals orbiting near Mercury turn sunlight into laser beams and deliver
    {helios-power}, {helios-sun-share} of the Sun's output.
  job: Harvest sunlight near Mercury and beam it
  scale: "{helios-area} of film; {helios-power} delivered"
  breakthrough: "{helios-efficiency} sunlight-to-target efficiency through kilometre-scale coherent laser arrays"
  specs:
    - { label: Orbits, value: "Circular, {helios-orbit-inner} to {helios-orbit-outer} from the Sun, at many inclinations so no Petal shades another" }
    - { label: Film temperature, value: "{helios-film-temp} near Mercury, {helios-film-temp-inner} on the innermost orbits" }
    - { label: Sunlight near Mercury, value: "{mercury-sunlight}" }
    - { label: End-to-end efficiency, value: "{helios-film-efficiency} film × {helios-laser-efficiency} laser × {helios-receiver-efficiency} receiver = {helios-efficiency}" }
    - { label: Petals, value: "{helios-petals}, each {helios-petal-side} square and {helios-petal-mass}" }
    - { label: Film area, value: "{helios-area}" }
    - { label: Mass, value: "{helios-mass}" }
    - { label: Delivered power, value: "{helios-power}, from {helios-full-power}" }
    - { label: Energy delivered by the deadline, value: "{helios-supply}" }
    - { label: Beam spot at Venus, value: "{helios-spot} wide from a {helios-aperture} aperture at {helios-range}" }
    - { label: Receiver intensity, value: "{helios-receiver-intensity}, actively cooled" }
    - { label: Receiver loss, value: "{helios-receiver-loss}, radiated from {helios-fin-temp} fins to space" }
  invented:
    - Hot-carrier tandem film that keeps {helios-film-efficiency} efficiency from {helios-film-temp} to {helios-film-temp-inner}
    - Phase-locked emitter grids acting as {helios-aperture} virtual apertures
  precedent: []
  experiments: [lightpipe]
  figures: [energy-sankey, lattice-budget]
  modules: [helios.ts]
  corrections: [budget-offwindow, helios-orbits]

- id: veil
  name: Hesperus Veil
  place: space
  online: veil-close
  summary: >-
    A light-bending shade of {veil-slats} slats held just sunward of the Sun-Venus L1 point turns
    away {veil-block-fraction} of the sunlight, then becomes the planet's dimmer switch and day clock.
  job: Sunshade, thermostat and day clock
  scale: "{veil-area}, {veil-mass}, {veil-distance} sunward"
  breakthrough: "{veil-slats} electrochromic, light-bending slats holding station, dimming from open to {veil-block-fraction} blocked"
  specs:
    - { label: Station, value: "{veil-distance} sunward of Venus, {veil-beyond-l1} beyond L1's {venus-l1-distance}" }
    - { label: Radius for full shadow, value: "{veil-radius}, Venus's {venus-radius} plus {veil-penumbra-margin}" }
    - { label: Area, value: "{veil-area}, {veil-area-vs-v2} times the version 2 statite" }
    - { label: Areal density, value: "{veil-areal-density}" }
    - { label: Mass, value: "{veil-mass}" }
    - { label: Slats, value: "{veil-slats}, each {veil-slat-side} square and {veil-slat-mass}" }
    - { label: Light pressure over solar gravity, value: "{veil-beta}" }
    - { label: Station-keeping, value: "Each slat corrects its tilt at {veil-trim-rate} to stay within {veil-station-tolerance} of its station, with no propellant" }
    - { label: Light through when closed, value: "Gaps under {veil-gap-max} of the area plus {veil-slat-leak} through the slats, inside the {veil-leak-budget} the Veil may let through" }
    - { label: Seen from Venus, value: "{veil-angular-radius} in radius, so Exhaust cones that face it tilt {exhaust-veil-tilt} off the Sun line and miss it" }
    - { label: Sunlight blocked when closed, value: "{veil-block-fraction} ({veil-blocked-power})" }
    - { label: Transmission, value: "Set per slat, from {veil-block-fraction} blocked to {veil-open-transmission} open" }
    - { label: Day mode, value: "{veil-day-transmission} open for Earth-strength daylight" }
    - { label: Light time to Venus, value: "{veil-light-delay}" }
    - { label: Closes, value: "{veil-close|date=day}" }
  invented:
    - Slats that bend sunlight past Venus instead of reflecting it, switching transmission in seconds
    - "Closed slats that block every colour, the Exhaust's {exhaust-wavelength} included, letting through no more than {veil-slat-leak}"
  precedent:
    - text: Angel's 2006 design for shading Earth with refracting flyers near L1, which light pressure barely moves.
      source: angel-2006
    - text: Light pressure moves a sunshade's balance point sunward of L1.
      source: sanchez-mcinnes-2015
  experiments: [veil-1]
  figures: [veil-geometry]
  modules: [veil.ts]
  corrections: [veil-l1, veil-opaque]

- id: chimneys
  name: Thermal Chimneys
  place: venus
  online: cooling-start
  summary: >-
    {chimney-count} fan-driven columns, {chimney-diameter} wide and {chimney-height} tall, carry deep
    heat up to the Exhaust canopies at {chimney-heat} each.
  job: Lift deep heat to the cloud tops
  scale: Forced-convection columns {chimney-height} tall
  breakthrough: Structures that survive {venus-surface-temp} and {venus-surface-pressure} through the {cooling-seconds} of active cooling
  specs:
    - { label: Number, value: "{chimney-count}, one per canopy, about {chimney-spacing} apart" }
    - { label: Diameter, value: "{chimney-diameter}" }
    - { label: Height, value: "{chimney-base} above the surface to {chimney-top}" }
    - { label: Gas at the base, value: "{venus-surface-temp}, {venus-surface-density}, {venus-surface-pressure}" }
    - { label: Flow speed, value: "{chimney-flow-speed}" }
    - { label: Mass flow, value: "{chimney-mass-flow} each" }
    - { label: Heat delivered, value: "{chimney-heat} each, cooling the gas by {chimney-gas-cooling}" }
    - { label: Fans, value: "{chimney-fan-power} in all, {chimney-fan-share} of the heat carried" }
    - { label: Total capacity, value: "{chimney-capacity}, {chimney-vs-peak} times the {deep-heat-peak} peak deep heat flow" }
  invented:
    - Silicon-carbide and graphene composite walls stable at {venus-surface-temp} in CO₂, SO₂ and acid for the {cooling-seconds} of active cooling
    - Ground anchors that grip basalt at {venus-surface-temp}
  precedent: []
  experiments: []
  figures: [heat-path]
  modules: [exhaust.ts]

