- id: acid
  name: Acid Sweep
  place: venus
  online: traj-clear-rain
  summary: >-
    Cooling makes the sulfur rain out. The SO₂ dissolves in the CO₂ seas and freezes into the
    cryo-continents; the {venus-cloud-acid} of cloud acid and the SO₂ left in the air are neutralized
    with crushed basalt before the oceans arrive.
  job: Remove the sulfuric-acid clouds
  scale: Rain-out plus basalt neutralization
  breakthrough: None but scale
  specs:
    - { label: SO₂, value: "{venus-so2-fraction|show=ppm}, {venus-so2-mass}; {so2-sealed-share} sealed in the cryo-continents" }
