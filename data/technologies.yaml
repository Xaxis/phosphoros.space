    - { label: Cap, value: "{cryo-membrane-thickness} graphite membrane, {cryo-aerogel-thickness} carbon aerogel, {cryo-armour-thickness} basalt" }
    - { label: Cap mass, value: "{cryo-cap-mass} of Forge graphite" }
    - { label: Heat leaking down through the cap, value: "{cryo-leak-flux}, {cryo-leak-total} in all" }
