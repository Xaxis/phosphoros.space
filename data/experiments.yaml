# The nine proof experiments. All start in 2027 and run in parallel, and each must pass by the end
# of 2028. A kill signal stops the line it tests. fallback: true marks a line with no substitute: if
# it fails, the whole plan falls back to the multi-century route. The others can be replaced. then:
# the next mark the line must reach after it passes, if the plan sets one.

experiments:
  - id: ouroboros-0
    name: Ouroboros-0
    where: Earth
    tech: ouroboros
    fallback: true
    proves: A factory that builds itself from simulated Mercury regolith
    pass: "{ouroboros-0-closure} mass closure, doubling in under {ouroboros-0-doubling}"
    kill: "Under {ouroboros-0-kill-closure} closure"
  - id: exhaust-1
    name: Exhaust-1
    where: Laboratory
    tech: exhaust
    fallback: true
    proves: Electroluminescent cooling at useful power
    pass: "{exhaust-1-cooling} of net cooling, within {exhaust-1-carnot} of the Carnot limit"
    then: "The production tile must reach {exhaust-flux} by {exhaust-production-tile|date=year}"
    kill: "No net cooling above {exhaust-1-kill-cooling}"
  - id: lightpipe
    name: Lightpipe
    where: Low Earth orbit
    tech: helios
    proves: Coherent power beaming
    pass: "{lightpipe-power} over {lightpipe-range} between satellites at {lightpipe-efficiency} end to end"
    kill: "Phase lock fails beyond {lightpipe-kill-emitters} emitters"
  - id: veil-1
    name: Veil-1
    where: Orbit
    tech: veil
    proves: An electrochromic slat
    pass: "A {veil-1-area} slat in orbit dims from clear to {veil-1-dim} blocked and holds its attitude"
    kill: "The film degrades within {veil-1-kill-life}"
  - id: railhead
    name: Railhead
    where: Earth
    tech: ice-train
    proves: An ice mass driver
    pass: "{railhead-test-mass} of ice at {railhead-test-speed}, {railhead-test-rate} shots an hour"
    kill: "Under {railhead-kill-speed}, or under {railhead-kill-rate} shot an hour"
  - id: cryo-seal
    name: Cryo-seal
    where: Earth
    tech: cryo
    proves: "Dry-ice storage under a {earth-surface-temp} sky"
    pass: "Under {cryo-leak-flux} of heat leak, what the plan's cap gives, for {cryo-seal-months}"
    kill: The cap cracks under thermal cycling
  - id: mini-aegis
    name: Mini-Aegis
    where: Sun-Earth L1
    tech: aegis
    proves: A magnetic shield
    pass: "A {mini-aegis-coil} coil's bubble deflects the solar wind"
    kill: Repeated quenches
  - id: cloud-life
    name: Cloud-life survey
    where: Venus
    gate: true
    proves: No native life will be harmed
    pass: Balloon and droplet sample return show no biology
    kill: "A credible biosignature: the whole program stops"
  - id: choir-sim
    name: Choir-sim
    where: Earth
    tech: choir
    proves: Fleet autonomy
    pass: "{choir-sim-robots} robots run a factory for {choir-sim-days} unattended"
    kill: "More than {choir-sim-kill-interventions} human intervention a day"

fallback: If Ouroboros or the Photonic Exhaust fails, the plan falls back to the multi-century route.
