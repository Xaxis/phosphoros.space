# --- Ouroboros Foundry -----------------------------------------------------------------------------
foundry-seed-mass:
  value: 1.0e6
  unit: kg
  show: t
  label: Seed foundry mass
  basis: design
  range: [1.0e5, 1.0e7]
foundry-seed-launch:
  value: 2028-10-01
  unit: date
  label: Seed foundry launches from Earth
  basis: design
foundry-transfer-days:
  value: 105
  unit: d
  label: Earth-to-Mercury transfer
  sig: 3
  basis: design
foundry-doubling-days:
  value: 60
  unit: d
  label: Foundry doubling time
  basis: invented
  range: [30, 120]
  note: The single most important invention. The 1980 NASA study's lunar factory was meant to copy itself in about a year.
foundry-target-mass:
  value: 6.0e13
  unit: kg
  label: Machinery the Foundry grows to before it builds the Lattice and the Ring
  basis: design
  note: About the mass of the Lattice and the Ring together. A Foundry that stops growing at the mass of what it must build next finishes it soonest; the check foundry-size confirms the doubling count.
foundry-energy-per-kg:
  value: 1.0e8
  unit: J/kg
  show: MJ/kg
  label: Energy to make a kilogram of machinery from regolith
  basis: invented
  range: [3.0e7, 3.0e8]
foundry-complex-share:
  value: 0.02
  unit: "1"
  show: "%"
  label: Share of each copy's mass in complex parts (chips, bearings, optics)
  basis: invented
  note: The rest is simple, fast-to-make mass (film, beams, rail, wire). This is how the loop doubles in 60 days.
lithocell-feature-size:
  value: 9.0e-8
  unit: m
  show: nm
  label: Smallest feature a Lithocell chip fab writes
  basis: invented
  note: Written directly by a million parallel electron beams, with no masks.

