# --- Hesperus Veil ---------------------------------------------------------------------------------
veil-areal-density:
  value: 1.0e-3
  unit: kg/m2
  show: g/m2
  label: Veil film areal density
  basis: invented
veil-momentum-fraction:
  value: 0.01
  unit: "1"
  label: Share of sunlight's momentum the light-bending film takes up
  basis: invented
  range: [0.002, 0.1]
  note: A mirror takes up 2, a black sheet 1. A clear film that bends light a few degrees, with good anti-reflection coatings, about 0.01.
veil-block-fraction:
  value: 0.999
  unit: "1"
  show: "%"
  label: Share of sunlight the closed Veil keeps from Venus
  basis: design
  sig: 3
veil-open-transmission:
  value: 0.60
  unit: "1"
  show: "%"
  label: Most light a slat lets through when open
  basis: invented
veil-slat-side:
  value: 1200
  unit: m
  show: km
  label: Slat edge
  basis: design
veil-trim-rate:
  value: 1
  unit: Hz
  label: How often each slat corrects its tilt to keep station
  basis: design
veil-station-tolerance:
  value: 1000
  unit: m
  show: km
  label: How far a slat may drift from its station
  basis: design
veil-gap-max:
  value: 5.0e-4
  unit: "1"
  show: "%"
  label: Largest share of the Veil's area left as gaps between slats
  basis: design
  note: Under the brief's 0.1%. Light through the gaps reaches Venus, so the gaps and the closed slats share the little the closed Veil may let through.
veil-slat-leak:
  value: 3.0e-4
  unit: "1"
  show: "%"
  label: Share of sunlight a closed slat lets through toward Venus, in every colour
  basis: invented
  note: The slats bend and darken every colour, including the Exhaust's band; the Exhaust aims its cones around the Veil instead of through it.
veil-build-start:
  value: 2030-06-01
  unit: date
  label: Veil slat production begins
  basis: design
veil-close:
  value: 2032-12-01
  unit: date
  label: Veil closes over Venus
  basis: design
  note: Late enough that the Foundry, large by then, stops growing for only about ten days to build it, and still months before the Lattice's power starts the cooling.

# --- Thermal Chimneys ------------------------------------------------------------------------------
chimney-count:
  value: 10000
  unit: count
  label: Number of chimneys (one per canopy)
  basis: design
chimney-diameter:
  value: 3500
  unit: m
  show: km
  label: Chimney diameter
  basis: design
  note: Wide enough to carry the same heat as version 3's first 2 km design while cooling the air by a third as much, which keeps the pumps' cold side close to the air's temperature.
chimney-flow-speed:
  value: 20
  unit: m/s
  label: Air speed through a chimney's intake exchangers
  basis: design
chimney-gas-cooling:
  value: 100
  unit: K
  label: How much the air cools passing a chimney's intake exchangers, at the starting 737 K
  basis: design
  note: A share of the air's temperature, so it shrinks as the air cools. Cooling the air less costs fan power (bigger flow) but saves pump work (warmer cold side); the fans are far cheaper.
chimney-loss-coefficient:
  value: 4
  unit: "1"
  label: Pressure lost across a chimney's exchangers, in units of the flow's dynamic pressure
  basis: invented
  note: Typical of finned heat exchangers with ducting.
chimney-base:
  value: 1000
  unit: m
  show: km
  label: Chimney base height
  basis: design
chimney-top:
  value: 65000
  unit: m
  show: km
  label: Chimney top height
  basis: design
deep-heat-peak:
  value: 6.0e18
  unit: W
  label: Peak heat flow from the deep atmosphere
  basis: design

# --- Photonic Exhaust ------------------------------------------------------------------------------
exhaust-effective-temp:
  value: 2000
  unit: K
  label: Effective temperature the emitters shine at
  basis: invented
  range: [1000, 3000]
exhaust-bandgap:
  value: 0.54
  unit: eV
  label: Emitter tile bandgap (InGaAsSb)
  basis: invented
exhaust-peak:
  value: 5.0e19
  unit: W
  label: Peak power the Exhaust can throw into space
  basis: design
  range: [3.0e19, 7.0e19]
  note: Version 2 sized it at 3.6 × 10¹⁹ W from the campaign's average. The day-by-day simulation shows the Exhaust, not the power supply, sets the pace once the Ring pays for the Railheads, and at 3.6 × 10¹⁹ W Venus is Earth-like only in April 2037.
exhaust-canopies:
  value: 10000
  unit: count
  label: Number of floating canopies
  basis: design
exhaust-cone:
  value: 25
  unit: deg
  label: Beam cone each tile fires into (full apex angle)
  basis: invented
exhaust-band:
  value: 4.0e-7
  unit: m
  show: µm
  label: Width of the band each tile emits in
  basis: invented
  note: About the natural width of a light-emitting diode's line at a few hundred kelvin. A wider band carries more entropy per joule, which is what the pumps need.
cooling-end:
  value: 2036-09-01
  unit: date
  label: Active cooling ends
  basis: design
  note: Set just after the simulated Frost Towers finish. The check that they finish before the caps are sealed fails if the simulation passes this date.
frost-tower-temp:
  value: 133
  unit: K
  label: Frost Tower cold-trap temperature
  basis: invented
  sig: 3
exhaust-eqe:
  value: 0.999
  unit: "1"
  show: "%"
  sig: 3
  label: External quantum efficiency of the emitter tiles (photons out per electron in)
  basis: invented
  note: Every electron that recombines without emitting dumps its energy into the tile as heat, so net cooling at high power needs almost every electron to make a photon.

