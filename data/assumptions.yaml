# Program assumptions: the choices and inventions Phosphoros makes. Change any of these and rerun
# `pnpm calc` (or move its slider in the Explorer on the site) to see every consequence.
#
# basis:  design    a choice (a date, a size, a count)
#         invented  a breakthrough the plan assumes; it does not exist yet
#         precedent demonstrated in the real world (cite it)
# Dates are YYYY-MM-DD; the model counts them as days from 2027-01-01.
# range: the span the Explorer lets a reader try.

# --- The program -----------------------------------------------------------------------------------
program-start:
  value: 2027-01-01
  unit: date
  show: day
  label: Program start
  basis: design
survey-start:
  value: 2027-06-01
  unit: date
  label: Cloud-life survey begins
  basis: design
survey-end:
  value: 2028-12-01
  unit: date
  label: Cloud-life survey reports
  basis: design
life-gate:
  value: 2028-12-15
  unit: date
  show: day
  label: "Gate: no native life found"
  basis: design
  note: Two weeks after the survey reports. The seed foundry is already in flight by then; the gate falls before it lands on Mercury, so a find stops the landing.
experiments-end:
  value: 2028-12-31
  unit: date
  label: Proof experiments must pass by
  basis: design
deadline:
  value: 2036-12-31
  unit: date
  show: day
  label: Earth-like Venus, the finish line
  basis: design
date-2030:
  value: 2030-01-01
  unit: date
  label: Reporting date, January 2030
  basis: design
date-2032:
  value: 2032-01-01
  unit: date
  label: Reporting date, January 2032
  basis: design
freeze-target-temp:
  value: 195
  unit: K
  label: Temperature the air is cooled to, freezing out its CO₂
  sig: 3
  basis: design
  note: Just above CO₂'s frost point at one atmosphere, 194.7 K.
crust-cooling-step:
  value: 400
  unit: K
  label: How much the crust's surface cools
  basis: design
skin-campaign-years:
