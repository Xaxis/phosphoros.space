# The decade, as rows for the Gantt chart. `start` and `end` name a date in the model (an input in
# assumptions.yaml or a date the model derives), so moving an assumption moves the chart. A row
# with no end is a milestone; kind gate marks a go or no-go decision.
#
#   lane: science | mercury | space | ceres | venus
#   tech: the technology page the row belongs to
#   critical: on the critical path (see critical_path below)

lanes:
  - { id: science, label: Science and proof }
  - { id: mercury, label: Mercury }
  - { id: space, label: Near Venus }
  - { id: ceres, label: Ceres }
  - { id: venus, label: Venus }

rows:
  - id: experiments
    label: Proof experiments
    lane: science
    start: program-start
    end: experiments-end
    link: research
  - id: survey
    label: Cloud-life survey
    lane: science
    start: survey-start
    end: survey-end
    link: research
  - id: life-gate
    label: "Gate: no native life"
    lane: science
    kind: gate
    start: life-gate
    link: risks
  - id: seed-launch
    label: Seed foundry launches
    lane: mercury
    kind: milestone
    start: foundry-seed-launch
    tech: ouroboros
    critical: true
  - id: foundry-growth
    label: Ouroboros growth
    lane: mercury
    start: foundry-landing
    end: foundry-full-scale
    tech: ouroboros
    critical: true
  - id: first-petals
    label: First Petals and test slats fly
    lane: mercury
    kind: milestone
    start: helios-first-petals
    tech: helios
  - id: helios-build
    label: Helios Lattice built
    lane: mercury
    start: foundry-full-scale
    end: helios-full-power
    tech: helios
    critical: true
  - id: veil-build
    label: Hesperus Veil built
    lane: space
    start: veil-build-begin
    end: veil-close
    tech: veil
  - id: ring-build
    label: Braking Ring built
    lane: space
    start: ring-build-begin
    end: ring-complete
    tech: ring
  - id: aegis-online
    label: Aegis Shield online
    lane: space
    kind: milestone
    start: aegis-online
    tech: aegis
  - id: ceres-seed-launch
    label: Ceres seed launches
    lane: ceres
    kind: milestone
    start: ceres-seed-launch
    tech: ice-train
  - id: ceres-growth
    label: Ceres factories grow
    lane: ceres
    start: ceres-landing
    end: ceres-full-scale
    tech: ice-train
  - id: railhead-build
    label: Railheads and Crown built
    lane: ceres
    start: ceres-full-scale
    end: ceres-ready
    tech: ice-train
  - id: ice-launches
    label: Ceres ice launches
    lane: ceres
    start: ice-launch-start
    end: ice-launch-end
    tech: ice-train
    critical: true
  - id: ring-pays
    label: The Ring pays for the launches
    lane: ceres
    kind: milestone
    start: ring-pays-from
    tech: ring
  - id: cooling
    label: Active cooling
    lane: venus
    start: cooling-start
    end: cooling-end
    tech: exhaust
  - id: clear-rain
    label: The Clear Rain
    lane: venus
    kind: milestone
    start: traj-clear-rain
    tech: cryo
  - id: sealing
    label: CO₂ rain-out and sealing
    lane: venus
    start: traj-clear-rain
    end: sealing-end
    tech: cryo
  - id: ice-catch
    label: Ice caught and parked
    lane: space
    start: first-catch
    end: last-arrival
    tech: ring
    critical: true
  - id: ice-lowering
    label: Ice lowered, oceans fill
    lane: venus
    start: lowering-start
    end: lowering-end
    tech: ring
  - id: forging
    label: Oxygen forging
    lane: venus
    start: forge-start
    end: forge-end
    tech: forges
  - id: acid-sweep
    label: Acid sweep, until the pH holds
    lane: venus
    start: cooling-start
    end: genesis-ph-clear
    tech: acid
  - id: genesis
    label: Genesis seeding, oceans green
    lane: venus
