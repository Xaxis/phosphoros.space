critical_path: >-
  The critical path runs through the Foundry. The seed must launch by {foundry-seed-launch} so the
  Lattice reaches full power by {helios-full-power}. Ice launched after {ice-launch-end} cannot
  arrive before the deadline, so any slip in the doubling time comes straight out of the water.
  Ceres's factories, launched the same day, finish the Railheads {ceres-slack} before the first launch.
