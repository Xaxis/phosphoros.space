- id: enmod
  kind: law
  title: Convention on the Prohibition of Military or Any Other Hostile Use of Environmental Modification Techniques (ENMOD)
  authors: United Nations
  year: 1976
  url: https://treaties.un.org/Pages/ViewDetails.aspx?src=TREATY&mtdsg_no=XXVI-1&chapter=26&clang=_en
