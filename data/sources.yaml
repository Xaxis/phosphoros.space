# Every source Phosphoros cites. Ids are referenced by `source:` in constants.yaml and assumptions.yaml,
# by `sources:` in the other data files, and as [label](sources.md#id) in docs/.
#
#   kind:     data | paper | book | report | news | law | web
#   checked:  the date someone last opened the link and confirmed it says what we cite it for
#   note:     what we use it for, and any caveat a reader should know
#
# A link that is dead or wrong goes here with a note, never silently. Open an "add a source" issue
# to propose one.

