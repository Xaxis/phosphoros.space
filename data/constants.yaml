# Physical constants and measured facts. Every number here is established physics or measurement,
# not a choice: change one only with a better measurement and a source.
#
# Each entry:  value (SI), unit (SI, see calc/src/format.ts), label, basis, source (keys in
# sources.yaml), optional show (display unit), sig (significant figures), note.
# Dates and choices live in assumptions.yaml.

# --- Fundamental ---------------------------------------------------------------------------------
