  value: 6.62607015e-34
  unit: J s
  label: Planck constant
  basis: physics
  source: [codata-2018]
  sig: 9
electron-volt:
  value: 1.602176634e-19
  unit: J
  label: Electron volt
  basis: physics
  source: [codata-2018]
  sig: 10
stefan-boltzmann:
  value: 5.670374419e-8
  unit: W m-2 K-4
  label: Stefan-Boltzmann constant
  basis: physics
  source: [codata-2018]
  sig: 4
gas-constant:
  value: 8.314462618
  unit: J/mol/K
  label: Molar gas constant
  basis: physics
  source: [codata-2018]
  sig: 4
proton-mass:
