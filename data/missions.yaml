# Real precursor missions to Venus, for the Precursor Science page. Dates change: each entry says
# when it was last checked and against which source. Version 2's dates are kept in `brief` so the
# change is visible.

checked: 2026-11-20
missions:
  - id: davinci
    name: DAVINCI
    lead: NASA Goddard (PI Jim Garvin)
    launch: Late December 2030
    brief: December 2030
    arrives: Probe descent through the atmosphere on 3 October 2032
    contributes: Deep-atmosphere composition, noble gases and evidence of a past ocean; the first direct measurements below the clouds since 1985
    informs: [exhaust, cryo, acid]
    status: >-
      Launch brought forward a year. Congress funded it for FY2026 after the budget request proposed
      cancelling it. The FY2027 request again proposes ending it; the Senate subcommittee mark
      (12 November 2026) directs $263M. NASA runs on a continuing resolution to 11 December 2026.
    sources: [ars-2026-venus, planetary-2026-fy2026, planetary-2026-fy2027, spacepolicy-2026-senate]
  - id: veritas
    name: VERITAS
    lead: NASA JPL
    launch: November 2032
    brief: November 2032
    arrives: Venus orbit in mid-2033, then aerobraking
    contributes: Global 3D topography and surface composition; where the basins that will hold the CO₂ seas are, and how hot the rock beneath them is
    informs: [cryo, chimneys]
    status: >-
      Funded for FY2026 after a proposed cancellation. The FY2027 request again proposes ending it;
      the Senate subcommittee mark directs $49M.
    sources: [ars-2026-venus, planetary-2026-fy2027, spacepolicy-2026-senate]
  - id: envision
    name: EnVision
    lead: ESA (prime contractor Thales Alenia Space)
    launch: 2032, on Ariane 6
    brief: November 2031
    changed: true
    arrives: After a 15-month cruise and 11 months of aerobraking
    contributes: Venus as a system, from core to upper atmosphere; active volcanism and the surface's history
    informs: [cryo, acid, chimneys]
    status: >-
      Delayed one year, to 2032, after NASA withdrew its VenSAR radar; ESA is studying a European
      radar instead. ESA's own pages still say November 2031.
    sources: [ars-2026-envision, esa-envision]
  - id: vlf
    name: Venus Life Finder (Morning Star)
    lead: Rocket Lab with MIT (Sara Seager); privately funded
    launch: Late 2027 at the earliest, awaiting Neutron
    brief: TBC, awaiting Neutron
    changed: true
    arrives: A small probe falls through the clouds, sampling for about five minutes
    contributes: Organic molecules in cloud droplets; the first direct look for the chemistry of life in the clouds
    informs: [genesis]
    gate: true
    status: >-
      Waiting for Rocket Lab's Neutron rocket, whose first launch moved to 2027 in October 2026.
    sources: [spacecom-2026-vlf, rocketlab-2026-neutron, ars-2026-venus]
  - id: verve
    name: VERVE
    lead: Cardiff University (Jane Greaves), proposed to ESA
    launch: Would ride with EnVision, so 2032 if selected
    brief: Would ride with EnVision
    arrives: Separates from EnVision at Venus and descends through the clouds
    contributes: Phosphine, ammonia and other reduced gases that might signal life
    informs: [genesis]
    gate: true
    status: >-
      A small probe proposed to ESA's mini-F call. We found no selection decision after July 2025.
    sources: [ras-2025-verve, astrobiology-2025-verve]

note: >-
  None of these missions can rule out life in the clouds by the end of 2028, when Phosphoros's gate
  falls. That is why the plan flies its own cloud-life survey, and why the gate is honest only if
  the survey's balloons and sample return are as thorough as the experiments page demands.
