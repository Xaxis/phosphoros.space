# Risks, what goes wrong, and the safeguard. Shown on the Risks and Governance page.

risks:
  - id: runaway
    risk: Runaway replication
    what: Copies grow past their mandate
    safeguard: A hard mass budget in the Choir Mass Ledger, signed build orders, and an international kill code
    tech: [ouroboros, choir]
  - id: beam
    risk: Beam misdirection
    what: "A beam carrying {helios-power} hits the wrong target"
    safeguard: "Every beam fires only with a live, signed handshake from its receiver and defocuses within {beam-defocus-time} once the handshake stops arriving. At the longest range the handshake is {helios-handshake-delay} old when it arrives, so light already in flight, aimed where the receiver was, still lands"
    tech: [helios]
  - id: veil-failure
    risk: Veil failure after cooling
    what: Sunlight boils the CO₂ back out
    safeguard: "{veil-slats} independent slats that fail opaque, so a dead slat still shades, and CO₂ sealed in cryo-continents"
    tech: [veil, cryo]
  - id: breach
    risk: Cryo-continent breach
    what: CO₂ escapes back into the air
    safeguard: "{cryo-cells} compartments of {cryo-cell-area}, each with its own seal and refrigeration"
    tech: [cryo]
  - id: ceres
    risk: Ceres depletion
    what: "{ice-ceres-water-share} of Ceres's water is used and its orbit is changed for good"
    safeguard: Agreed internationally in advance; comets from the outer belt as the fallback
    tech: [ice-train]
  - id: native-life
    risk: Native life on Venus
    what: Cooling the planet would destroy it
    safeguard: The 2027 to 2028 cloud-life survey gates the Veil; a credible biosignature stops the program
    tech: [veil, genesis]
  - id: weapons
    risk: Weaponization
    what: Mass drivers and power beams are also weapons
    safeguard: Open telemetry, inspection, and treaty oversight beyond the Outer Space Treaty
    tech: [ice-train, helios]
  - id: ice-heat
    risk: The Bricks bring their heat faster than the pumps can lift it
    what: Every kilogram of ice brings {ice-entry-energy-per-kg} as it falls, {ice-entry-heat} in all, {ice-entry-vs-atmosphere} of the atmosphere's own heat, and it arrives in ten weeks, several times faster than the lit canopies' chimneys carry heat out; the air warms back {traj-rewarm} and the first Clear Rain boils back until the pumps catch up. Twice the ice would leave the caps unfinished at the deadline
    safeguard: The model sizes the ice to what the pumps can lift, and the frost-before-sealing check fails before a heavier shipment could cost the deadline; Venus gets seas {ocean-depth} deep, not Earth's oceans
    tech: [ice-train, exhaust]
  - id: brick-strays
    risk: A Brick falls outside the drop zones
    what: Each Brick bursts with {brick-entry-energy}, about the energy of a large hydrogen bomb; one that strayed onto the canopies would wreck them
    safeguard: The Lattice's lasers steer every Brick in flight, and the drop zones beyond {ice-drop-latitude} of latitude hold no canopies; a Brick off its track is pushed wide of Venus while it is still far out
    tech: [ice-train, helios]
  - id: optical-cooling
    risk: Light cannot cool the tiles at the flux they need
    what: Laser light has cooled solids by tens of kelvin in the laboratory, at milliwatts; each tile must give off {exhaust-flux} with {exhaust-eqe} of its absorbed photons coming back out, at {exhaust-pump-room-start} of each photon's energy spare for heat
    safeguard: Exhaust-1 measures a tile's real cooling against the pump light before any canopy is built; the plan stops there if it fails
    tech: [exhaust, helios]
  - id: venus-hardware
    risk: The hardware at Venus delays cooling
    what: The tiles, chimneys, receivers and Lanterns weigh {venus-hardware-mass}; the Foundry builds them after the Lattice, in {venus-hardware-build-days}, and cooling waits for them, so a slower build eats the {frost-sealing-slack} before the last caps
    safeguard: Lighter tiles and chimneys, or an industry at Venus that builds them from the air's own carbon
    tech: [exhaust, chimneys, ouroboros]

governance: >-
  The 1967 Outer Space Treaty bars national appropriation of celestial bodies (Article II) and
  requires states to avoid their harmful contamination (Article IX). Nothing in it contemplates
  rebuilding a planet, moving a dwarf planet's orbit or aiming beams of {helios-power} across the inner Solar
  System. Phosphoros needs a new international framework, starting from COSPAR's planetary
  protection policy, agreed before the seed launches.
