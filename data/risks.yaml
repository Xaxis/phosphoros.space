# Risks, what goes wrong, and the safeguard. Shown on the Risks and Governance page.

risks:
  - id: runaway
    risk: Runaway replication
    what: Copies grow past their mandate
    safeguard: A hard mass budget in the Choir Mass Ledger, signed build orders, and an international kill code
    tech: [ouroboros, choir]
  - id: beam
    risk: Beam misdirection
    what: "A beam carrying {helios-power} hits the wrong target"
    safeguard: "Every beam fires only with a live, signed handshake from its receiver and defocuses within {beam-defocus-time} once the handshake stops arriving. At the longest range the handshake is {helios-handshake-delay} old when it arrives, so light already in flight, aimed where the receiver was, still lands"
    tech: [helios]
  - id: veil-failure
    risk: Veil failure after cooling
    what: Sunlight boils the CO₂ back out
    safeguard: "{veil-slats} independent slats that fail opaque, so a dead slat still shades, and CO₂ sealed in cryo-continents"
    tech: [veil, cryo]
  - id: breach
    risk: Cryo-continent breach
    what: CO₂ escapes back into the air
    safeguard: "{cryo-cells} compartments of {cryo-cell-area}, each with its own seal and refrigeration"
    tech: [cryo]
  - id: ceres
    risk: Ceres depletion
    what: "{ice-ceres-water-share} of Ceres's water is used and its orbit is changed for good"
    safeguard: Agreed internationally in advance; comets from the outer belt as the fallback
    tech: [ice-train]
  - id: native-life
    risk: Native life on Venus
    what: Cooling the planet would destroy it
    safeguard: The 2027 to 2028 cloud-life survey gates the Veil; a credible biosignature stops the program
    tech: [veil, genesis]
  - id: weapons
    risk: Weaponization
    what: Mass drivers and power beams are also weapons
    safeguard: Open telemetry, inspection, and treaty oversight beyond the Outer Space Treaty
    tech: [ice-train, helios, ring]
  - id: ring-lowering
    risk: The Ring cannot lower the ice as designed
    what: Tether lowering needs {lowering-overload} times the lift the rotor has to spare (an open problem in version 3)
    safeguard: Drop the ice from rest at the Ring and pump out the extra heat; the energy budget never counted lowering's recovered energy
    tech: [ring]
    open: true
  - id: ring-net-force
    risk: Nothing holds the Ring against the catch
    what: The catch leaves {ring-net-braking-force} along Venus's orbit, {ring-net-overload} times the rotor's spare lift, and an orbital ring has no stiff way to hand it to the planet (an open problem in version 3)
    safeguard: None yet. Braking the ice in the air instead would turn its motion into heat, so the problem must be solved before the first catch
    tech: [ring]
    open: true
  - id: exhaust-entropy
    risk: The Exhaust's light costs more than the model charges
    what: Light in the tiles' narrow band and cone needs {exhaust-work-multiple} times the pump work the budget charges (an open problem in version 3)
    safeguard: Tiles that spread their light over more colours and directions while it still escapes the air; Exhaust-1 measures the real cost before any canopy is built
    tech: [exhaust]
    open: true
  - id: loss-heat
    risk: The receivers' and the Ring's loss heat falls on Venus
    what: Fins that radiate from both faces near Venus shine {ring-fin-venus-share} of their heat onto it, {loss-heat-into-venus} at full power, more than the cooling can absorb (an open problem in version 3)
    safeguard: One-sided radiators with shielded backs facing Venus, or radiators far from the planet; the published schedule leaves this heat out until one is shown to work
    tech: [helios, ring]
    open: true
  - id: ring-equipment
    risk: The Ring cannot carry its receivers
    what: The receivers, fins and catch radiators weigh {ring-equipment-mass}, {ring-equipment-overload} times what the rotor can hold up besides the stator (an open problem in version 3)
    safeguard: Lighter receivers at higher beam intensity, a heavier or faster rotor, or receivers on the canopies with their heat pumped out
    tech: [ring, helios]
    open: true
  - id: venus-hardware
    risk: Nothing builds the hardware at Venus in time
    what: The tiles, chimneys, receivers and Lanterns weigh {venus-hardware-mass}; the full Foundry would take {venus-hardware-build-days} to build them, and cooling would start late (an open problem in version 3)
    safeguard: Lighter tiles and chimneys, or an industry at Venus that builds them from the air's own carbon
    tech: [exhaust, chimneys, ouroboros]
    open: true

governance: >-
  The 1967 Outer Space Treaty bars national appropriation of celestial bodies (Article II) and
  requires states to avoid their harmful contamination (Article IX). Nothing in it contemplates
  rebuilding a planet, moving a dwarf planet's orbit or aiming beams of {helios-power} across the inner Solar
  System. Phosphoros needs a new international framework, starting from COSPAR's planetary
  protection policy, agreed before the seed launches.
