- id: chimney-design
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Cooling waits for the chimneys, and the chimneys cool the air less
  issue: 5
  text: >-
    The simulation now caps the heat it removes at what the chimneys carry; the cap binds on
    160 d. It also charges what the chimneys cost the pumps. The exchangers cooled the
    air by 300 K, and the pumps see that heat over the whole range, as if the air were at the
    range's log-mean temperature: about 22% colder, which raised the work for each joule of the
    gas's heat by a third or more.
    Version 3's chimneys are wider, 3.5 km, and cool the air by 100 K,
    so the pumps see 0.931 of its temperature. The bigger flow costs fan power,
    1.0 × 10¹⁷ W, which the budget now charges.
  before:
    chimney-diameter: 2000
    chimney-gas-cooling: 300
    chimney-flow-area: 3.14e6
