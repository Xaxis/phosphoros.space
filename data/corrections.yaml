- id: lit-side
  kind: correction
  version: "4"
  date: 2026-11-23
  title: Only the side of Venus the Lattice sees can be pumped
  text: >-
    Pumped by light, a tile works only while the Lattice can reach it. The Lattice orbits inside
    Venus's orbit, so it sees only the sunward side, {exhaust-lit-share} of the canopies at once,
    and the lit tiles must shine for all of them. At 1,600 K they would need more than the whole lit
    side. A mirror hovering behind Venus cannot relay the beams to the night side: to hold still its
    push must point straight away from Venus, and then the beam it sends on misses Venus by as much
    as the beam it takes in. The tiles now shine as brightly as a {exhaust-effective-temp} black
    body and peak at {exhaust-peak}, over {exhaust-area-share} of Venus, {canopy-band-cover} of the
    band between the drop zones. Their light counts as hotter, so the pumps need more of it, and the
    Lattice grows to {helios-power}. Only the lit canopies' chimneys carry heat, so the chimneys
    widen to {chimney-diameter}.
