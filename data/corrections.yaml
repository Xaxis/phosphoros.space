    Version 2 priced every Ice Train shot at the Hohmann minimum, but the Railheads fire all the
    time. A shot between launch windows needs a faster orbit to meet Venus: up to
    {launch-offwindow-max} more energy at the worst moment, {launch-offwindow-mean} more on average.
    Charging the average raises the launch energy to {ice-launch-energy} and the Railheads' power to
    {railhead-power}. Until the Ring takes over, cooling gets less of the Lattice, so the Clear Rain
    moves to {traj-clear-rain|date=month} and all the CO₂ is down on {traj-cold|date=day}. The air
    is Earth-like on {traj-earth-like|date=day}.
