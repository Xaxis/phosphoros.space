- id: choir-count
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Choir's machine count comes from the model
  text: >-
    Version 2 said Choir runs a trillion machines, a number nothing in the plan sized. Version 3
    counts the machines the model does size, {choir-machines}: the Lattice's Petals, the Veil's
    slats, the Exhaust canopies, the Thermal Chimneys, the Forges, the Railheads and the Ring's
    tether lifts. The Foundry's own robots are not sized, so this is a floor.
