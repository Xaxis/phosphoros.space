- id: genesis-ph
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Seeding waits for the ocean pH gate as well as the oxygen
  text: >-
    Seeding began the day the oxygen was in, {forge-end|date=day}, which met the pH gate (oceans
    above pH {genesis-ph-min} for {genesis-ph-days}) with almost nothing to spare. With the later melt the pH
    gate opens on {genesis-ph-clear|date=day}, so seeding now begins at the later of the two gates,
    {genesis-start|date=day}. Seeded at {genesis-seed-density} and doubling every
    {genesis-doubling-days}, the cyanobacteria reach the density of rich Earth seawater on
    {genesis-end|date=day}, and a new check holds that to the deadline. That date used to mark the
    end of seeding; it now marks green water.
  before: { genesis-end: 2036-12-15 }
- id: budget-offwindow
  kind: open
  version: "3"
  date: 2026-11-20
  title: From the Lattice alone, the energy budget does not close
  issue: 12
  text: >-
    Charging the launches fired between windows adds {ice-launch-offwindow-energy} to the demand.
    The Lattice delivers {helios-supply} against {budget-demand}, so it falls short:
    {budget-spare} spare. The plan closes only with the Ring's recovered energy, which leaves
    {budget-spare-with-ring} spare, so the Ring is no longer a margin but a necessity. Options
    under study: fire harder near each window (more Railheads, less energy), a larger Lattice, or
    less water.
- id: choir-count
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Choir's machine count comes from the model
  text: >-
    Version 2 said Choir runs a trillion machines, a number nothing in the plan sized. Version 3
    counts the machines the model does size, {choir-machines}: the Lattice's Petals, the Veil's
    slats, the Exhaust canopies, the Thermal Chimneys, the Forges, the Railheads and the Ring's
    tether lifts. The Foundry's own robots are not sized, so this is a floor.
