    budget-spare-with-ring: 0.345
    budget-lattice-spare: 3.18e27
- id: floor-melts
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Unrefrigerated floor heat melts the base of the ice
  issue: 10
  text: >-
    The model priced the floor heat, if it is not pumped away, with the deposition heat, as if it
    turned the ice straight to gas. Under 2 km of dry ice the base is at
    280 bar, far above the triple-point pressure, so the heat melts it, which takes
    only the heat of fusion, 210 kJ/kg: 0.4% of the CO₂ a year at
    first, 7.6 m off the base of the sheet. The liquid is lighter than the ice above
    it and carries its weight, so it lubricates the sheet and presses toward the cell walls. The
    basal refrigeration the plan already carries keeps the base below its melting point,
    222 K.
  before: { cryo-unrefrigerated-loss: 0.00141 }
- id: freeze-outlasts-sealing
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Exhaust grows a tenth so the seas freeze before the caps are sealed
  issue: 10
  text: >-
    Releasing the heat of fusion at the triple point holds the air at 216.6 K while the seas
    freeze, with the Exhaust at its peak and the falling ice adding most of the heat that enters
    meanwhile. At the old peak the seas froze only in June 2036, the Frost Towers finished after the
    last caps were due on 1 September 2036, and seeded life greened the oceans after the
    deadline. The peak grew to 5.5 × 10¹⁹ W, and the seas froze before the caps were due. It cost
    little energy, because a faster freeze lets less heat in. The peak has since grown again, to
    1.2 × 10²⁰ W, for pumps charged as real machines: the seas are frozen through on
    13 February 2036, the Frost Towers finish 150 d before the last caps, and
    the oceans are green on 12 December 2036.
  before: { exhaust-peak: 5.0e19 }
- id: so2-sealed
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The SO₂ freezes into the cryo-continents, so the Acid Sweep takes up only what is left
  issue: 8
  text: >-
    Version 2 sized the lime to neutralize every molecule of Venus's SO₂. But SO₂ is far less
    volatile than CO₂, and measured CO₂ + SO₂ equilibria put it in the liquid when the CO₂ condenses.
    When the seas start to freeze at the triple point, they hold 99.4% of it, and it
    freezes with them under the caps. What reaches the oceans is the 1.0 × 10¹⁴ kg of cloud acid
    that rains out first and, counted in full, the 6.1 × 10¹⁴ kg of SO₂ still in the air:
    0.63% of the sulfur. The lime falls to 5.9 × 10¹⁴ kg and the basalt to 6 × 10¹⁵ kg,
    spread 6.3 mm deep on the land outside the basins.
  before: { acid-cao: 9.29e16, acid-basalt: 9.29e17, acid-basalt-layer: 2.06, acid-crust-share: 6.73e-4 }
- id: lattice-to-ceres
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The longest beam to Ceres starts from the Lattice, not the Ring
  issue: 7
  text: >-
    Version 2 measured the longest beam to Ceres from Venus, because the Ring beamed the Railheads'
    power there. Version 3 sends nothing back from the Ring; the Lattice beams Ceres itself, from
    orbits as far out as 0.45 AU. The longest range is 3.2 AU, and
    a 10 km aperture focuses the beam to 120 m.
  before: { ring-to-ceres-range: 5.22e11, ceres-beam-spot: 136 }
- id: ceres-heat
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Ceres's receivers and the Railheads' loss are shed in space, by the Crown
  issue: 7
  text: >-
    Version 2 said the receivers at Ceres would need more area than its surface and left them
    unsized. The real limit is heat: the receivers and the Railheads make 110
    times more than Ceres's whole surface could radiate at 1,500 K, so almost none of it
    can be made on the ground. Version 3 puts the receivers on the Crown, a ring at Ceres's
    synchronous orbit 720 km up, with tethers carrying the power down. The receivers
    take 40 MW/m², so each square metre hands its coolant 10 MW/m²,
    what ITER's divertor is built for. The Railheads' barrels are superconducting and leave only
    1.1 × 10¹⁷ W on Ceres; the rest of their loss arises where the power is shaped into
    pulses, in the Crown, which radiates 9.0 × 10¹⁹ W from 1.6 × 10¹⁴ m² of fins. The Railheads
    weigh at least 7.2 × 10¹³ kg and the Crown 5.3 × 10¹³ kg.
- id: ceres-factories
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Ceres factories are seeded with the Foundry and must double faster
  issue: 7
  text: >-
    Version 2 sent the first Ceres factories from Earth but never sized them. Version 3 launches a
    1,000 t seed on 1 October 2028, behind the same Ouroboros-0 gate as the
    Foundry's, which now must close its loop on simulated Ceres rock too. To build the
    1.2 × 10¹⁴ kg of Railheads and Crown by the first launch, the factories must double every
    45 d, faster than the Foundry; they finish on 14 July 2033. At the
    Foundry's pace they would finish only in September 2034.
- id: ceres-jupiter
  kind: finding
  version: "3"
  date: 2026-11-20
  title: Ceres's new orbit stays clear of Jupiter; resonances are not modelled
  issue: 7
  text: >-
    Ceres's new aphelion stays 1.64 AU inside Jupiter's perihelion,
    4.6 of Jupiter's Hill radii, and its Tisserand parameter with respect to
    Jupiter falls from 3.31 to 3.21, still above 3. The model does not
    follow resonances: the new orbit sits on Jupiter's weak 9:4 resonance, and a long numerical
    integration must show it is stable before the first shot.
- id: foundry-target
  kind: correction
  version: "3"
  date: 2026-11-21
  title: The Foundry's target is what it builds next
  text: >-
    The Foundry's target mass was typed in as 6.0 × 10¹³ kg, about the Lattice and the Ring before
    the Lattice grew. It is now computed from them, 9.8 × 10¹³ kg, and the doubling count is the exact soonest finish: one more doubling pays while the Foundry is
    under the target divided by 2 ln 2. The plan still stops at 27 doublings, so no
    date moves, but a larger Lattice in the Explorer now grows the Foundry as it should, where
    before it stopped one doubling short.
  before:
    foundry-target-mass: 6.0e13
- id: loss-heat
  kind: finding
  version: "3"
  date: 2026-11-21
  title: The receivers' and the Ring's loss heat falls on Venus
  issue: 14
  text: >-
    Version 3 said the receivers' loss heat, 4.0 × 10¹⁹ W, and the heat the catcher tracks
    shed, 5.4 × 10¹⁹ W, radiate to space and never reach Venus. A radiator near a planet
    cannot help shining on it: fins standing upright at the Ring's height send 28%
    of their light onto Venus, and fins on the canopies 41%. That is
    2.7 × 10¹⁹ W at full power, and with it counted the cooling does not finish in time.
    The published schedule still leaves this heat out, and the check loss-heat-fits measures it.
    Options under study: one-sided radiators whose backs, facing Venus, are shielded by stacks of
    polished foil as in vacuum furnaces, or radiators placed far from the planet. Version 4 pumps the tiles with the light itself, and counts the loss heat of the receivers that remain.

- id: ring-equipment
  kind: finding
  version: "3"
  date: 2026-11-21
  title: The Ring cannot carry the receivers the plan hangs on it
  issue: 15
  text: >-
    The stator's mass, 3.0 × 10¹² kg, was said to include the Lattice's receivers. It does not:
    at the densities the plan uses for the same hardware on Ceres, the receivers, their fins and the
    catch's radiators weigh 4.8 × 10¹³ kg, and the rotor can hold up only 3.9 × 10¹² kg
    besides the stator, 12 times too little. The stator's mass now counts the
    tracks, tether heads and cables, and the check ring-carries-equipment weighs the rest. Options:
    receivers at a higher beam intensity, a heavier or faster rotor (which the Foundry must then
    build), or receivers on the canopies with their loss heat pumped out by the Exhaust. Version 4 retires the Ring and pumps the tiles with the light itself.

- id: venus-hardware
  kind: correction
  version: "3"
  date: 2026-11-21
  title: Cooling waits for the hardware at Venus
  issue: 18
  text: >-
    The Foundry's books counted the Foundry, the Veil, the Lattice and the Ring, but not the Exhaust's
    tiles and canopies (1.6 × 10¹⁴ kg), the chimneys (1.4 × 10¹³ kg), the receivers and their
    fins, or the Lanterns, and cooling began the day the Foundry reached full scale, before any of
    them existed. Together they weigh 2.1 × 10¹⁴ kg, more than the Foundry itself. The Foundry
    now builds them after the Lattice and the Ring, in 140 d, and active cooling
    begins when they reach Venus, on 5 April 2034.
  before:
    cooling-start: 2033-05-03
    foundry-built-mass: "1.4e14"
    hardware-energy: "1.4e22"
- id: derived-basis
  kind: correction
  version: "3"
  date: 2026-11-21
  title: A computed number is no firmer than what it is computed from
  text: >-
    Derived numbers carried a basis typed by hand, and many computed by physics from invented inputs
    were marked Physics, among them the Earth-like date itself. Every computed number now carries the
    weakest basis among what it reads, so the date Venus becomes Earth-like is marked Invented: it
    rests on inventions. No value changes.
- id: ice-schedule
  kind: correction
  version: "3"
  date: 2026-11-21
  title: Every Brick flies its own transfer, out of Ceres's tilted orbit
  issue: 16
  text: >-
    Version 3 charged each launch between windows its cheapest transfer, but timed every arrival as if
    the Brick flew the standard Hohmann transfer, left out the 7.2° tilt between
    Ceres's orbit and Venus's, and launched every Brick from Ceres's original orbit, though the recoil
    moves it outward. Each synodic cycle's launches are now booked to arrival slots, transfer by
    transfer with Lambert's method, for the least launch energy with at most 3 times
    the mean arriving at once. The plane change is paid at launch and at the catch, and the last
    launches leave from the drifted orbit. Launches cost 37% more than the Hohmann
    minimum on average, the Railheads draw 1.1 × 10²⁰ W, and Bricks reach the Ring at
    18.2 km/s. The slowest transfer, 611 d, moves the last launch to
    14 April 2035. The Ring now gives back 1.1 × 10²⁸ J, and the simulation
    takes its power day by day as the Bricks arrive, not at its average from the first catch.
