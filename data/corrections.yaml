- id: direct-entry
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The Bricks fall straight into the air, so Venus gets seas, not oceans
  issue: 2
  text: >-
    Nothing catches the Bricks now. Each one bursts in the air beyond {ice-drop-latitude} of
    latitude, clear of the canopies, and its whole fall from far out, {ice-entry-energy-per-kg},
    becomes heat the pumps must lift. Version 3's 10²⁰ kg of ice would have brought 18 times the
    heat of Venus's whole atmosphere that way, and an ocean in Earth's proportion would bring
    {ocean-entry-vs-atmosphere} times. The plan ships {ice-mass}, enough to cover Venus
    {ocean-depth} deep, which gathers as seas in the lowlands. Its entry heat is
    {ice-entry-vs-atmosphere} of the atmosphere's own. The launches take {ice-campaign-days}, from
    {ice-launch-start|date=day} instead of running into 2035, so the Bricks fall into air that is
    still hot.
