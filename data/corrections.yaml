- id: optical-pumping
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The Lattice's light pumps the tiles directly
  issue: 15
  text: >-
    Version 3 turned the Lattice's beams into electricity and sent it to the pumps, but the
    receivers had nowhere to go: the Ring could not carry them, and on the canopies their fins shone
    on Venus. The Exhaust's tiles now take the light itself. Each tile is a semiconductor with a
    bandgap of {exhaust-bandgap}, pumped at {helios-wavelength}, a little below it, so every photon
    it absorbs leaves as one of its own, a little bluer, with the difference taken from heat. Lasers
    already cool some crystals this way in the laboratory. The Lattice's efficiency loses its
    receiver and rises from 15% to {helios-efficiency}. Only the Railheads, the Forges and the
    chimney fans still run on receivers. The check exhaust-pump-photons confirms that each photon
    has room for the heat the model has it carry.
