- id: v4
  kind: version
  version: "4"
  date: 2026-11-23
  title: Phosphoros without the Ring
  text: >-
    Version 3 ended with five open problems: three in the Braking Ring, one in the loss heat of its
    receivers and one in the Exhaust's beams. Version 4 closes all five by changing the design,
    never the physics. The Ring is gone, and the Bricks fall straight into the air. The Lattice's
    light pumps the Exhaust's tiles directly, the tiles shine over their whole sky, and the pumps
    are charged for that light's entropy. Only the side of Venus the Lattice sees can be pumped. The
    plan ships a hundredth of the water, and the Lattice and the tiles grow.
  before:
    checks-total: 35
    checks-failing: 6
    checks-passing: 29
- id: ring-retired
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The Braking Ring is retired
  issue: 3
  text: >-
    Version 3 needed the Ring to catch every Brick, lower the ice on tethers and carry the Lattice's
    receivers. It could do none of them: lowering needed 150 times the rotor's spare lift, the
    catch's forward push was 2,000 times that lift with no way to hand it to Venus, and the
    receivers weighed 12 times what the rotor could hold up. A rotor that could would be heavier and
    faster by those same factors. Version 4 builds no Ring. The energy it would have recovered,
    which version 3 counted as supply from the first catch, goes with it, so the budget counts only
    the Lattice.
