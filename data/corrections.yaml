- id: chimney-design
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Cooling waits for the chimneys, and the chimneys cool the air less
  issue: 5
  text: >-
    The simulation now caps the heat it removes at what the chimneys carry; the cap binds on
    {traj-chimney-days}. It also charges what the chimneys cost the pumps. The exchangers cooled the
    air by 300 K, and the pumps see that heat over the whole range, as if the air were at the
    range's log-mean temperature: about 22% colder, which raised the work for each joule of the
    gas's heat by a third or more.
    Version 3's chimneys are wider, {chimney-diameter}, and cool the air by {chimney-gas-cooling},
    so the pumps see {chimney-cold-factor} of its temperature. The bigger flow costs fan power,
    {chimney-fan-power}, which the budget now charges.
  before:
    chimney-diameter: 2000
    chimney-gas-cooling: 300
    chimney-flow-area: 3.14e6
    chimney-mass-flow: 4.10e9
    chimney-heat: 1.23e15
    chimney-capacity: 1.23e19
    chimney-vs-peak: 2.05
