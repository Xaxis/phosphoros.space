  title: Every receiver's loss heat is lifted with the rest
  issue: 14
  text: >-
    Version 3's published schedule left out the receivers' loss heat, 2.7 × 10¹⁹ W of it falling on
    Venus. With the pumps taking the light itself, the receivers that remain power only the Forges
    and the fans. They sit on the canopies and shed {venus-receiver-loss} into the air at full
    output, and the simulation counts it day by day with the heat from the crust, the Forges, the
    fans, the Bricks and their water. Nothing the plan makes is left out of the heat the pumps lift,
    so the loss-heat check is retired.
