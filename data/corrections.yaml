- id: choir-count
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Choir's machine count comes from the model
  text: >-
    Version 2 said Choir runs a trillion machines, a number nothing in the plan sized. Version 3
    counts the machines the model does size, 3.9 × 10⁸: the Lattice's Petals, the Veil's
    slats, the Exhaust canopies, the Thermal Chimneys, the Forges, the Railheads and the Ring's
    tether lifts. The Foundry's own robots are not sized, so this is a floor.
- id: veil-spare
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Veil's spare slats are not claimed until the model carries them
  text: >-
    Version 2 listed 20% spare slats as a safeguard against the Veil failing after cooling. The
    model sizes the Veil, its mass and the date the Foundry can afford it with no spares, so
    version 3 no longer claims them. The safeguards it does carry are 3.8 × 10⁸ independent
    slats that fail opaque and the CO₂ sealed under the cryo-continents.
- id: helios-orbits
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The longest beam starts from the Lattice's outermost orbit
  text: >-
    Version 2 put the Petals on orbits from 0.3 AU to 0.45 AU but
    measured the longest beam from Mercury's orbit. Measured from the outermost Petals, the
    longest beam to Venus is 1.2 AU, and a 10 km aperture spreads it to
    46 m.
  before: { helios-range: 1.66e11, helios-spot: 43 }
- id: exhaust-safety
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Exhaust's dark strip and far-field distance come from its cone
  text: >-
    Version 2 kept tiles dark in a strip 50 km wide under the Ring's path and said each cone falls
    below 10 W/m² beyond about 50,000 km. Both follow from the 25° cone. A
    cone from the chimney tops at 65 km is 150 km wide by the time it reaches
    the Ring at 400 km, so the strip must be that wide, 1.2% of the
    surface. At peak power one canopy's cone is still brighter than 10 W/m² out to
    90,000 km; where cones overlap, their light adds.
  before: { exhaust-dark-strip: 5.0e4, exhaust-cone-safe-distance: 5.0e7 }
- id: veil-opaque
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Veil blocks every colour, and the Exhaust aims around it
  text: >-
    Version 2's slat was a metal mirror from 0.3 to 2.0 µm with a dielectric stack clear at the
    Exhaust's 2.3 µm, so the outgoing beams could pass through the Veil. The
    Exhaust's band holds 1.9% of sunlight, and a Veil clear there would let it
    reach Venus: 19 times the 0.1% the whole closed Veil may
    let through. Version 3's slats block every colour, and the Exhaust aims around the Veil instead.
    Seen from Venus it is only 0.68° in radius, so tiles that face it tilt their
    cones 13° off the Sun line. Gaps between slats are held to 0.05%,
    under version 2's 0.1%, so that gaps and closed slats together fit inside the budget.
- id: chimney-heat-lift
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The chimneys lift heat in a liquid, not hot air
  text: >-
    Version 2's chimneys were ducts: deep air rose inside them, gave up its heat at the canopy and
    sank outside, driven by fans spaced up the column. Rising air expands and cools, and Venus's
    lower air already has the temperature profile of air that rose that way, so it would reach the
    canopy about as cold as the cloud tops, its heat turned into height. Version 3's chimneys take
    the heat out of the air at depth, through fan-driven intake exchangers, and lift it in sealed
    liquid loops, whose temperature barely changes with pressure. They work until all the CO₂ is
    down, March 2036, not only until 2035, because the simulated cooling runs longer
    than version 2 planned.
  issue: 5
- id: campaign-dates
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The simulation and the flight times set the campaign's dates
  text: >-
    Version 2 set the campaign's later dates by hand: rain-out from June 2034, the seas freezing
    and the caps sealed in 2035, catching from August 2034 and lowering from August 2034, before
    the Clear Rain had cleared the air. Version 3 takes them from the day-by-day simulation and the
    Ice Train's flight times: the Clear Rain on 22 January 2035, the seas freezing on
    4 September 2035, the last caps sealed by 1 September 2036 and the first Brick
    caught on 3 July 2034. Lowering is planned from 30 June 2035, and how to
    do it is still an open problem.
  before: { lowering-start: 2034-08-01 }
- id: ring-energy-swap
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Ring's energy reaches Ceres by swapping customers, not by a second beam
  text: >-
    Version 2 beamed the Ring's electricity back to Ceres. A beam keeps only
    50% of the power through its lasers and 75%
    through its receivers, so version 3 sends none back. The Ring's 2.2 × 10²⁰ W runs down the tethers to Venus's own
    systems, and the Helios Lattice, which already beams to Ceres, keeps doing so. The simulation
    counts it this way from July 2034.
- id: ring-tracks
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Ring needs more than eight catcher tracks
  text: >-
    Version 2 gave the Ring eight catcher tracks. Each Brick brakes for 23 s, so at
    the full rate 130,000 of them are on the tracks at once. Laid end to end, each
    103 m long, they fill at least 48 tracks of 290 km, before
    any gap between sleds. Version 3 carries as many tracks side by side as the rate needs.
- id: lanterns-night
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Lanterns hover behind Venus, off the Sun line
  text: >-
    Version 2 hovered the Lanterns east and west of Venus, where sunlight pushes across Venus's
    pull instead of against it, the same flaw as its Veil. Version 3 puts them on the night side,
    where the sunlight they reflect toward Venus pushes them away from it: mirrors of
    1 g/m² hover 140,000 km out. Straight behind Venus they would sit in
    the shadow of Venus and the Veil, so they stand 8.8° off the Sun line and
    spend 7.7% of their thrust holding station sideways.
- id: canopy-size
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Wider canopies carry the larger Exhaust
  text: >-
    Version 2's canopies were sized for its smaller Exhaust, with a hot-gas envelope a few hundred
    metres deep. Version 3's Exhaust peaks at 1.2 × 10²⁰ W, so each of its 10,000
    canopies holds 3.2 × 10¹⁰ m² of emitters and is 190 km across, floating at the
    chimney tops, 65 km up.
  before: { canopy-width: 7.0e4 }
- id: online-dates
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Each invention's online date comes from the model
  text: >-
    Version 2's table of inventions gave online dates by hand, and some disagreed with its own
    schedule: Choir was online in 2028 but went live with the seed in 2029. Version 3 reads each
    from the model. The Chimneys and the Exhaust start with active cooling,
    2034; the Lattice counts at full power, 2033; the
    Veil when it closes, 2032; the Ring at its first catch,
    2034; the Forges when they start, 2035; the
    Cryo-continents with the Clear Rain, 2035; and Choir with the landing,
    2029.
- id: aerogel-measured
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The cap's aerogel takes measured values
  text: >-
    Version 2 gave the cap's carbon aerogel a density of 100 kg/m³ and a conductivity of 0.014
    W/(m·K), with no source. Lu and colleagues measured 0.029 W/(m·K) in air at
    82 kg/m³ (1993). With the measured aerogel the caps leak 0.16 W/m²,
    24 TW in all, still small beside the floor heat, and take 2.5 × 10¹⁷ kg of
    graphite. The Cryo-seal experiment now passes at the leak the plan's own cap gives, instead of
    version 2's 0.1 W/m², which a cap of real aerogel this thick would fail.
  before:
    cryo-aerogel-density: 100
    cryo-aerogel-conductivity: 0.014
    cryo-leak-flux: 0.0756
    cryo-leak-total: 1.14e13
    cryo-cap-mass: 3.00e17
    graphite-stockpile: 1.87e17
- id: mercury-iron
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Mercury's surface is poor in iron
  text: >-
    Version 2 described Mercury's surface as rich in iron, silicon, aluminium, magnesium and sulfur.
    MESSENGER found it rich in sulfur, carbon and magnesium but poor in aluminium, calcium and
    iron: under 4% iron by mass, held mostly in sulfides and metal grains.
    The Foundry's iron cores and rails need more rock dug per kilogram than version 2 implied; the
    model does not yet size the Foundry's diggers by element.
- id: sublimation-curve
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The sublimation curve meets the vapour curve at the triple point
  issue: 10
  text: >-
    The model drew CO₂'s sublimation curve by Clausius-Clapeyron from one atmosphere at 194.7 K with
    a constant enthalpy. That curve gave 74 Pa at the Frost Towers' 133 K, and 4.9 bar
    at the triple point against the measured 5.2 bar, so the simulated pressure stepped
    down as the air crossed it. Span and Wagner's sublimation equation meets the vapour curve at their triple
    point, 216.6 K and 5.2 bar, which the model now uses as well, and gives
    54 Pa at 133 K. The Frost Towers leave 2.8 × 10¹⁵ kg
    airborne, and the finished air holds 230 ppm of CO₂.
  before:
    frost-co2-pressure: 74.0
    frost-residual-target: 3.84e15
    final-co2-ppm: 3.15e-4
    final-co2-vs-earth: 0.750
- id: triple-point-freeze
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The seas freeze at the triple point, and the simulation's heat books balance
  issue: 10
  text: >-
    The simulation released all of the CO₂'s latent heat evenly between its critical point and its
    triple point, although
    5.7% of the CO₂ is still vapour at the triple point and liquid CO₂ cannot
    freeze above it. Now the CO₂ gives up its heat of condensation as it rains out along the vapour
    curve; at the triple point the seas give up their heat of fusion, 210 kJ/kg, while the
    air holds at 216.6 K; and the CO₂ still in the air gives up the whole deposition heat
    as it freezes out below. The air reaches the triple point on 4 September 2035, the seas
    are frozen through on 13 February 2036, all the CO₂ is down on 30 March 2036, the
    Frost Towers finish on 9 April 2036 and the air is Earth-like on
    30 September 2036. The Frost Towers also counted the leftover CO₂'s latent heat a
    second time, the pumps ran on past the end of the cooling path, and heat entering after the
    pumps stopped was counted as lifted. With those fixed, the heat lifted equals Venus's heat, less
    the 1.6 × 10²¹ J the CO₂ left in the air still holds, plus the heat added while the
    pumps run, and a new check keeps it so. The time to lay the caps, 200 d, and the rate
    of laying them, 750,000 km²/d, are now model numbers.
  before:
    traj-freeze: 2036-06-23
    traj-cold: 2036-08-03
    traj-scavenged: 2036-08-22
    traj-warm: 2036-09-06
    traj-pump-energy: 3.53e27
    traj-heat-added: 7.91e25
    traj-exhaust-light: 4.13e27
    traj-fan-energy: 1.03e25
