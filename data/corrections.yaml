- id: genesis-ph
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Seeding waits for the ocean pH gate as well as the oxygen
  text: >-
    Seeding began the day the oxygen was in, 30 September 2036, which met the pH gate (oceans
    above pH 7.5 for 90 d) with almost nothing to spare. With the later melt the pH
    gate opens on 1 December 2036, so seeding now begins at the later of the two gates,
    1 December 2036. Seeded at 100 per cm³ and doubling every
    1 d, the cyanobacteria reach the density of rich Earth seawater on
    12 December 2036, and a new check holds that to the deadline. That date used to mark the
    end of seeding; it now marks green water.
  before: { genesis-end: 2036-12-15 }
- id: foundry-products
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Foundry pays for what it builds
  text: >-
    Version 2 grew the Foundry as if the Veil and the Lattice cost it nothing, and let the
    Lattice's power climb with the Foundry from 2030. Mass is conserved: every kilogram of product
    is a kilogram the Foundry did not add to itself. Now it stops growing for
    9.8 d to build the Veil, whose parts take 76 d to coast
    from Mercury to L1, so the Veil closes on 1 December 2032, late enough that the Foundry is
    large. It then grows to full scale and builds the Lattice and the Ring after. Growing to about
    the mass of what it must build next finishes soonest, so it stops at 27
    doublings, 1.3 × 10¹⁴ kg, instead of 27. Active cooling starts with the Lattice's first
    power, 5 April 2034, instead of January 2033, and the ice launches with full power
    on 28 August 2033. The Timeline and the animation drew the Veil, the Lattice and the
    Ring as built from 2030 and 2032; they now follow the Foundry, with the Veil from
    7 September 2032, the Lattice from 2 July 2033 and the Ring from
    28 August 2033.
