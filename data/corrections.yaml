- id: genesis-ph
  kind: correction
  version: "3"
  date: 2026-11-20
  title: Seeding waits for the ocean pH gate as well as the oxygen
  text: >-
    Seeding began the day the oxygen was in, {forge-end|date=day}, which met the pH gate (oceans
    above pH {genesis-ph-min} for {genesis-ph-days}) with almost nothing to spare. With the later melt the pH
    gate opens on {genesis-ph-clear|date=day}, so seeding now begins at the later of the two gates,
    {genesis-start|date=day}. Seeded at {genesis-seed-density} and doubling every
    {genesis-doubling-days}, the cyanobacteria reach the density of rich Earth seawater on
    {genesis-end|date=day}, and a new check holds that to the deadline. That date used to mark the
    end of seeding; it now marks green water.
  before: { genesis-end: 2036-12-15 }
- id: foundry-products
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Foundry pays for what it builds
  text: >-
    Version 2 grew the Foundry as if the Veil and the Lattice cost it nothing, and let the
    Lattice's power climb with the Foundry from 2030. Mass is conserved: every kilogram of product
    is a kilogram the Foundry did not add to itself. Now it stops growing for
    {veil-diversion-days} to build the Veil, whose parts take {mercury-venus-transfer-days} to coast
    from Mercury to L1, so the Veil closes on {veil-close|date=day}, late enough that the Foundry is
    large. It then grows to full scale and builds the Lattice and the Ring after. Growing to about
    the mass of what it must build next finishes soonest, so it stops at {foundry-doublings}
    doublings, {foundry-final-mass}, instead of 27. Active cooling starts with the Lattice's first
    power, {cooling-start|date=day}, instead of January 2033, and the ice launches with full power
    on {ice-launch-start|date=day}.
