- id: real-pumps
  kind: correction
  version: "3"
  date: 2026-11-21
  title: The heat pumps are charged as real machines, and the Exhaust and the Lattice grow to pay
  issue: 17
  text: >-
    Version 3 charged the heat pumps exactly the reversible work, the least the second law allows, so
    its second-law check could never fail; and the chimney fans' work, which ends as heat in the air
    they push, was never added to the heat the pumps must lift. The pumps are now charged at
    50% of the Carnot limit, about what good industrial heat pumps reach, and the
    fans' heat is counted. A hotter emitter needs less area but more work for every joule, so the
    design moves along that trade: the emitters shine at 1,600 K rather than
    2,000 K, the Exhaust peaks at 1.2 × 10²⁰ W over 70% of Venus's area, and the
    Lattice grows to 1.2 × 10²⁰ W to drive the pumps and the Railheads. The pumps spend
    8.5 joules of electricity per joule moved. Venus is still Earth-like on
    30 September 2036, and the Frost Towers finish 150 d before the last
    caps.
