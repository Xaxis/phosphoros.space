- id: dated-launches
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The launches are booked on their real dates
  text: >-
    Version 3 averaged the launch schedule over every phase of the Ceres-Venus cycle and over the
    whole of Ceres's orbit, since its campaign spanned more than two cycles. Version 4's campaign is
    a third of one cycle, so where the planets are on those days sets the price. The model now places
    Ceres and Venus by their measured orbits on each launch day and books every day's Bricks onto the
    cheapest transfer that leaves an arrival slot free. On {ice-launch-start|date=day} Venus leads
    Ceres by {ice-launch-lead}, {ice-window-wait} before a Hohmann window, so the first shots cost
    about a Hohmann launch and the last ones more: {launch-offwindow-mean} more on average. Paying
    launch energy for slower arrivals does not pay here: spread over months, they warm the air back
    less as they land, but the later ones fall into colder air, and the frost margin is no better.
