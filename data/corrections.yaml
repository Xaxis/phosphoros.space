- id: cooling-path-v4
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The air clears sooner, then the Bricks warm it back
  text: >-
    Cooling starts sooner and the air's sensible heat goes quickly, so the Clear Rain begins on
    {traj-clear-rain|date=day}. The Bricks arrive after that, from {first-arrival|date=day} to
    {last-arrival|date=day}, faster than the lit canopies' chimneys carry heat out, so the air warms
    back {traj-rewarm} and the first seas boil back into the air until the Clear Rain begins for good
    on {traj-rerain|date=day}. Their heat is lifted from air below 304 K, where it costs more to lift
    than at the start: the seas are frozen through on
    {traj-frozen|date=day}, and the Frost Towers finish on {traj-scavenged|date=day},
    {frost-sealing-slack} before the last caps. The new water rains out on
    {traj-water-rain|date=day}, freezes on {traj-water-frozen|date=day} and melts again once the
    Veil opens. Venus is Earth-like on {traj-earth-like|date=day}, as before.
