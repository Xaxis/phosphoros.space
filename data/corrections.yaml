- id: lambertian-tiles
  kind: correction
  version: "4"
  date: 2026-11-23
  title: The tiles shine over their whole sky, and the pumps pay for their light's entropy
  issue: 4
  text: >-
    Version 3's tiles fired their light into 25° cones, light that counts as 9,000 K by its entropy,
    and charged the pumps as if it were 1,600 K: lifting heat into it needed 9.6 times the work
    charged. The tiles now shine evenly over the whole sky above them, which carries the least
    entropy light that bright can, and every pump in the model, the simulation's included, is
    charged as if it rejected its heat at the temperature that light counts as,
    {exhaust-light-temp}. The cones' dark strip and their beam-safety distance are gone. Straight
    above a canopy its light falls below the far-field limit beyond {exhaust-safe-distance}, and the
    lit tiles send the Veil {exhaust-veil-load-share} of the sunlight it already turns away.
