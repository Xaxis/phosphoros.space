- id: aegis-coil
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Aegis coil grows to 1,000 km so it can hold itself together
  issue: 6
  text: >-
    A magnet's field pulls its own winding outward. Version 2's 10 km coil would have needed about
    10¹⁷ kg of the strongest carbon fibre to hold together, far more than the Foundry ever builds.
    The same dipole from a wider loop needs far less current, and the pull falls with the cube of
    the radius. At {aegis-coil-radius} the coil carries {aegis-ampere-turns} in all,
    {aegis-current} per turn, and its structure needs at least {aegis-structure-mass}.
  before: { aegis-coil-radius: 1.0e4, aegis-ampere-turns: 3.03e12, aegis-current: 3.03e6 }
- id: exhaust-entropy
  kind: open
  version: "3"
  date: 2026-11-20
  title: The Exhaust's narrow beams cost far more pump work than the model charges
  issue: 4
  text: >-
    The model charges the heat pumps the Carnot work for emitters at {exhaust-effective-temp}, right
    for light spread over colours and directions the way a surface that hot spreads it. The tiles
    instead put {exhaust-flux} into a {exhaust-band} band and a {exhaust-cone} cone, light that counts
    as at least {exhaust-light-temp} by its entropy. Lifting a joule from the starting air into it
    takes {exhaust-work-multiple} times the work charged. Either the tiles spread their light over
    far more colours and directions, or the pumps need many times the power. The budget's pump work
    is a floor until this is solved.
- id: budget-offwindow
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Lattice grows to 8.5 × 10¹⁹ W so the budget closes without the Ring
  issue: 12
  text: >-
    Charging the launches fired between windows added {ice-launch-offwindow-energy} to the demand,
    and the Lattice's power now arrives only once the Foundry stops growing. At 7 × 10¹⁹ W the
    Lattice alone fell 7% short, and the air was Earth-like only in February 2037. Version 2 raised
    the Lattice from 4 to 7 × 10¹⁹ W for the same reason: the launches. At {helios-power} the
    Lattice delivers {helios-supply} against {budget-demand}, {budget-spare} spare before the Ring's
    recovered energy and {budget-spare-with-ring} after, and the plan finishes on time. It takes
    {helios-mass} of petals, which the full Foundry builds in {lattice-build-days}.
