- id: aegis-coil
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Aegis coil grows to 1,000 km so it can hold itself together
  issue: 6
  text: >-
    A magnet's field pulls its own winding outward. Version 2's 10 km coil would have needed about
    10¹⁷ kg of the strongest carbon fibre to hold together, far more than the Foundry ever builds.
    The same dipole from a wider loop needs far less current, and the pull falls with the cube of
    the radius. At 1,000 km the coil carries 3 × 10⁸ A in all,
    300 A per turn, and its structure needs at least 2.0 × 10¹¹ kg.
  before: { aegis-coil-radius: 1.0e4, aegis-ampere-turns: 3.03e12, aegis-current: 3.03e6 }
- id: exhaust-entropy
  kind: finding
  version: "3"
  date: 2026-11-20
  title: The Exhaust's narrow beams cost far more pump work than the model charges
  issue: 4
  text: >-
    The model charges the heat pumps 50% of the Carnot efficiency for emitters at
    1,600 K, right for light spread over colours and directions the way a surface that
    hot spreads it. The tiles
    instead put 0.37 MW/m² into a 0.4 µm band and a 25° cone, light that counts
    as at least 9,000 K by its entropy. Lifting a joule from the starting air into it
    takes 9.6 times the work charged, for pumps equally far from the limit. Either the tiles spread their light over
    far more colours and directions, or the pumps need many times the power. The budget's pump work
    is a floor until this is solved. Version 4 spreads the tiles' light over their whole sky and charges the pumps for its entropy.

- id: budget-offwindow
  kind: correction
  version: "3"
  date: 2026-11-20
  title: The Lattice grows to 8.5 × 10¹⁹ W so the budget closes without the Ring
  issue: 12
  text: >-
    Charging the launches fired between windows added 1.5 × 10²⁷ J to the demand,
    and the Lattice's power now arrives only once the Foundry stops growing. At 7 × 10¹⁹ W the
    Lattice alone fell 7% short, and the air was Earth-like only in February 2037. Version 2 raised
    the Lattice from 4 to 7 × 10¹⁹ W for the same reason: the launches. Today, at 1.2 × 10²⁰ W, the
    Lattice delivers 1.3 × 10²⁸ J against 1.1 × 10²⁸ J, 11% spare before the Ring's
    recovered energy and 32% after, and the plan finishes on time. It takes
    8.8 × 10¹³ kg of petals, which the full Foundry builds in 57 d.
