  text: >-
    The Forges are rafts on the liquid CO₂ seas, but version 3 started them on 1 January 2035, three
    weeks before its Clear Rain began. In version 4 the Bricks' heat boils the first seas back into
    the air, and they return for good on {traj-rerain|date=day}. The Forges now start on
    {forge-start|date=day}, and a check holds them to the seas. They have the same oxygen to make in
    less time, so they run at {forge-power}.
