# Every number in the version 2 research brief, against the model. `pnpm check:claims` recomputes
# each and reports match, differs or corrected. A number that differs is never quietly changed:
# it gets a note here and, when it matters, an issue (see data/corrections.yaml).
#
#   model:  the quantity id that computes it
#   brief:  the brief's value, in the quantity's SI unit (dates as YYYY-MM-DD)
#   tol:    relative tolerance (default 0.10, since the brief writes "~"); for dates, days
#   where:  the brief's section
#   correction: id in corrections.yaml when version 3 changed the number on purpose
#   note:   why it differs, when it does

