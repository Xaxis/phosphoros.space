<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  /* A page's share card, 1200x630, in the style of tools/og.html. tools/assets.ts fills the
     [[slots]] from the page's own title and description (numbers from the model) and shoots it. */
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(900px 600px at 88% 8%, #1a1630, transparent 70%), #090a12;
    color: #ece6da; font-family: Inter, sans-serif;
    padding: 56px 72px;
  }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 28% 72%, #fff6 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 46% 12%, #fff7 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 88%, #fff5 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 8% 90%, #fff6 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 40%, #fff4 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 66% 30%, #fff6 50%, transparent 51%); }
  /* Venus at the card's corner, turning blue-green toward its limb: today becoming 2036. */
  .venus { position: absolute; width: 440px; height: 440px; right: -150px; top: -150px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 70%, rgba(99,205,185,.55), transparent 42%),
      radial-gradient(circle at 34% 30%, rgba(255,244,214,.9), rgba(255,216,140,.7) 18%, transparent 46%),
      repeating-linear-gradient(-14deg, rgba(255,170,90,.16) 0 16px, rgba(255,220,160,.06) 16px 34px),
      radial-gradient(circle at 40% 38%, #f6c56c, #e48a3a 55%, #8f3f17 100%);
    box-shadow: 0 0 120px 30px rgba(243,160,70,.22); }
  .brand { position: relative; display: flex; align-items: center; gap: 14px; font-family: Fraunces, serif; font-size: 30px; }
  .where { position: relative; margin: 64px 0 0; font-family: "IBM Plex Mono", monospace; font-size: 21px; color: #f3c463; }
  h1 { position: relative; margin: 14px 0 0; font-family: Fraunces, serif; font-weight: 400; font-size: 72px; line-height: 1.02; letter-spacing: -0.02em; max-width: 860px; }
  .line { position: relative; margin: 24px 0 0; font-size: 25px; line-height: 1.42; color: #c9c3b8; max-width: 900px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between;
    padding-top: 18px; border-top: 1px solid #2a2e48; font-size: 17px; color: #9b98a8; }
  .foot b { font-weight: 500; color: #ece6da; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="venus"></div>
  <div class="brand"><svg width="42" height="42" viewBox="0 0 32 32"><title>Phosphoros</title><defs><radialGradient id="g" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#fff4d6"/><stop offset=".45" stop-color="#f3c463"/><stop offset="1" stop-color="#d9792f"/></radialGradient></defs><path d="M16 1.5 17.6 13.2 29.5 16 17.6 18.8 16 30.5 14.4 18.8 2.5 16 14.4 13.2Z" fill="#f3c463" opacity=".45"/><circle cx="16" cy="16" r="7.2" fill="url(#g)"/></svg>Phosphoros</div>
  <p class="where">[[where]]</p>
  <h1>[[title]]</h1>
  <p class="line">[[line]]</p>
  <div class="foot"><span><b>[[foot]]</b></span><span>Venus, Earth-like, by 2036. Every number reproducible.</span></div>
</body>
</html>
