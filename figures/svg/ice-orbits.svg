562" y="66" dy="0.32em">Ceres&#x27;s orbit, before</text></g><g><line class="f-s1-line" x1="540" x2="556" y1="88" y2="88" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="562" y="88" dy="0.32em">Ceres&#x27;s orbit, after</text></g><g><line class="f-accent-line f-mark-line" x1="540" x2="556" y1="110" y2="110"></line><text x="562" y="110" dy="0.32em">Hohmann transfer</text></g><g><line class="f-accent-line" x1="540" x2="556" y1="132" y2="132" stroke-width="1" stroke-dasharray="2 4"></line><text x="562" y="132" dy="0.32em">Later windows</text></g><g><text class="f-label" x="540" y="178" text-anchor="start">The cheapest fall</text><text class="f-note f-num" x="540" y="192.5" text-anchor="start">1.15 yr, half the ellipse</text><text class="f-note f-num" x="540" y="207" text-anchor="start">launched at 6.4 km/s</text><text class="f-note f-num" x="540" y="221.5" text-anchor="start">arrives 9.08 km/s faster than Venus</text><text class="f-note f-num" x="540" y="236" text-anchor="start">between windows: 310 d to 611 d</text></g><g><text class="f-label" x="540" y="270" text-anchor="start">Launch windows</text><text class="f-note f-num" x="540" y="284.5" text-anchor="start">cheapest every 8.5 months</text><text class="f-note f-num" x="540" y="299" text-anchor="start">about 2.3 in the campaign,</text><text class="f-note f-num" x="540" y="313.5" text-anchor="start">August 2033 to April 2035</text></g><g><text class="f-label" x="540" y="348" text-anchor="start">Ceres pays in orbit</text><text class="f-note f-num" x="540" y="362.5" text-anchor="start">recoil adds 0.78 km/s to its speed</text><text class="f-note f-num" x="540" y="377" text-anchor="start">aphelion moves out to 3.31 AU</text><text class="f-note f-num" x="540" y="391.5" text-anchor="start">(today&#x27;s real aphelion: 2.98 AU)</text></g><g><rect class="f-axis" x="540" y="472" width="203" height="18" rx="9"></rect><text class="f-note" x="641.5" y="484.5" text-anchor="middle">Orbits to scale; dots enlarged</text