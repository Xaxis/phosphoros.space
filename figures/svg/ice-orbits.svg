ss="f-note f-num" x="360.42045545505215" y="282" dy="0.32em">Venus 0.723 AU</text><text class="f-note f-num" x="296" y="487.8274034845604" text-anchor="middle">Ceres 2.77 AU</text><g><line class="f-hot-line f-mark-line" x1="540" x2="556" y1="44" y2="44"></line><text x="562" y="44" dy="0.32em">Venus&#x27;s orbit</text></g><g><line class="f-s1-line f-mark-line" x1="540" x2="556" y1="66" y2="66"></line><text x="562" y="66" dy="0.32em">Ceres&#x27;s orbit, before</text></g><g><line class="f-s1-line" x1="540" x2="556" y1="88" y2="88" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="562" y="88" dy="0.32em">Ceres&#x27;s orbit, after</text></g><g><line class="f-accent-line f-mark-line" x1="540" x2="556" y1="110" y2="110"></line><text x="562" y="110" dy="0.32em">Hohmann transfer</text></g><g><text class="f-label" x="540" y="156" text-anchor="start">The cheapest fall</text><text class="f-note f-num" x="540" y="170.5" text-anchor="start">1.15 yr, half the ellipse</text><text class="f-note f-num" x="540" y="185" text-anchor="start">launched at 6.4 km/s, arriving</text><text class="f-note f-num" x="540" y="199.5" text-anchor="start">9.08 km/s faster than Venus</text></g><g><text class="f-label" x="540" y="226" text-anchor="start">The campaign, on its real dates</text><text class="f-note f-num" x="540" y="240.5" text-anchor="start">9 October 2033 to 7 January 2034</text><text class="f-note f-num" x="540" y="255" text-anchor="start">Venus leads Ceres by 214° at first,</text><text class="f-note f-num" x="540" y="269.5" text-anchor="start">7.9 d short of a window;</text><text class="f-note f-num" x="540" y="284" text-anchor="start">windows come every 8.5 months</text><text class="f-note f-num" x="540" y="298.5" text-anchor="start">flights take 341 d to 410 d</text></g><g><text class="f-label" x="540" y="330" text-anchor="start">Arrivals</text><text class="f-note f-num" x="540" y="344.5" text-anchor="start">November 2034 to January 2035</text><text class="f-note f-num" x="540" y="359" text-anchor="start">13.7 km/s faster than Venus</text><text class="f-note f-num" x="540" y="373.5" text-anchor="start">on average, falling into the air</text><text class="f-note f-num" x="540" y="388" text-anchor="start">beyond 60° latitude</text></g><g><text class="f-label" x="540" y="418" text-anchor="start">Ceres pays in orbit</text><text class="f-note f-num" x="540" y="432.5" text-anchor="start">recoil adds 0.0071 km/s to its speed</text><text class="f-note f-num" x="540" y="447" text-anchor="start">aphelion moves out to 2.77 AU</text><text class="f-note f-num" x="540" y="461.5" text-anchor="start">(today&#x27;s real aphelion: 2.98 AU)</text></g><g><rect class="f-axis" x="540" y="484" width="203" height="18" rx="9"></rect><text class="f-note" x="641.5" y="496.5" text-anchor="middle">Orbits to scale; dots enlarged</text></g><text class="f-note" x="540" y="522">Seen from the north: everything</text><text class="f-note" x="540" y="537">goes round anticlockwise.</text></g></svg>
