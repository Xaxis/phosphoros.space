.fig .f-halo{fill:none;stroke:var(--f-surface);stroke-linejoin:round}</style><rect width="100%" height="100%" rx="12" class="f-surface"/><title id="acid-sweep-t">Acid Sweep: the sulfur&#x27;s path out of the air and the oceans</title><desc id="acid-sweep-d">Three schematic cross-sections of a highland and a lowland basin. From May 2033, mills grind 9 × 10¹⁷ kg of basalt and canopy drones lay it 2.1 m deep on the basin floors. By July 2034 the acid clouds have rained out onto it and liquid CO₂ washes the SO₂ down, where lime turns it to gypsum. From October 2036, shore basalt holds the oceans between pH 7.5 and 8; no life is released until they stay above 7.5 for 90 d. Below, the masses of SO₂, lime and basalt to scale.</desc><g aria-hidden="true"><text class="f-title" x="16" y="22">The sulfur&#x27;s path, step by step</text><g><rect class="f-axis" x="585.1" y="8" width="158.9" height="18" rx="9"></rect><text class="f-note" x="664.5500000000001" y="20.5" text-anchor="middle">Schematic, not to scale</text></g><g><rect class="f-axis" x="16" y="36" width="234" height="336" rx="8"></rect><circle class="f-accent" cx="36" cy="58" r="9"></circle><text class="f-surface" x="36" y="58" dy="0.35em" text-anchor="middle" font-weight="700" font-size="11.5">1</text><text class="f-label" x="52" y="62" font-weight="600">Grind and dust</text><text class="f-note f-num" x="52" y="77">from May 2033</text><path class="f-muted-wash" d="M17.0,196.0L74.0,196.0L112.0,246.0L194.0,246.0L226.0,204.0L249.0,204.0L249,270L17,270Z"></path><path class="f-ink-line" d="M17.0,196.0L74.0,196.0L112.0,246.0L194.0,246.0L226.0,204.0L249.0,204.0" stroke-width="1.5"></path></g><rect class="f-s4-wash" x="17" y="100" width="232" height="24"></rect><text class="f-note" x="26" y="116">acid clouds</text><g><line class="f-soft-line" x1="128" y1="151" x2="119" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="128" y1="151" x2="128" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="128" y1="151" x2="137" y2="239" stroke-dasharray="1 3"></line><rect class="f-ink" x="123" y="143" width="10" height="6" rx="2"></rect></g><g><line class="f-soft-line" x1="156" y1="161" x2="147" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="156" y1="161" x2="156" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="156" y1="161" x2="165" y2="239" stroke-dasharray="1 3"></line><rect class="f-ink" x="151" y="153" width="10" height="6" rx="2"></rect></g><g><line class="f-soft-line" x1="184" y1="151" x2="175" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="184" y1="151" x2="184" y2="239" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="184" y1="151" x2="193" y2="239" stroke-dasharray="1 3"></line><rect class="f-ink" x="179" y="143" width="10" height="6" rx="2"></rect></g><rect class="f-soft" x="110" y="241" width="86" height="5" rx="1"></rect><path class="f-ink" d="M32,196V184l8,-6v6l8,-6v6l8,-6V196Z"></path><g><text class="f-note f-num" x="28" y="150" text-anchor="start">rock</text><text class="f-note f-num" x="28" y="164.5" text-anchor="start">mills</text></g><g><path class="f-soft-line" d="M58,180Q82,150 113.21658036042457,147.39861830329795" stroke-width="1.5" stroke-linecap="round"></path><path class="f-soft" d="M118,147L112.33721456285048,145.01685575592512L112.743566512727,149.89307915444343Z"></path></g></g><a href="/technologies/exhaust" aria-label="Exhaust canopy: its drones dust the basin floors"><g aria-hidden="true"><path class="f-soft f-node" d="M128,112L136,107H228L236,112L228,117H136Z"></path><text class="f-note" x="236" y="96" text-anchor="end">Exhaust canopy</text></g><rect class="f-node" x="139.83999999999997" y="84" width="102.16000000000001" height="17" rx="5" fill="none" pointer-events="all"></rect></a><g aria-hidden="true"><g><text class="f-note f-num" x="28" y="296" text-anchor="start">9 × 10¹⁷ kg of highland basalt,</text><text class="f-note f-num" x="28" y="310.5" text-anchor="start">0.07% of the crust&#x27;s top km,</text><text class="f-note f-num" x="28" y="325" text-anchor="start">ground to dust. Drones lay it</text><text class="f-note f-num" x="28" y="339.5" text-anchor="start">2.1 m deep on the basin floors,</text><text class="f-note f-num" x="28" y="354" text-anchor="start">33% of Venus.</text></g><g><rect class="f-axis" x="263" y="36" width="234" height="336" rx="8"></rect><circle class="f-accent" cx="283" cy="58" r="9"></circle><text class="f-surface" x="283" y="58" dy="0.35em" text-anchor="middle" font-weight="700" font-size="11.5">2</text><text class="f-label" x="299" y="62" font-weight="600">The Clear Rain</text><text class="f-note f-num" x="299" y="77">by July 2034</text><path class="f-muted-wash" d="M264.0,196.0L321.0,196.0L359.0,246.0L441.0,246.0L473.0,204.0L496.0,204.0L496,270L264,270Z"></path><path class="f-ink-line" d="M264.0,196.0L321.0,196.0L359.0,246.0L441.0,246.0L473.0,204.0L496.0,204.0" stroke-width="1.5"></path></g><rect class="f-s4-wash" x="264" y="100" width="232" height="24"></rect><line class="f-s4-line" x1="281" y1="128" x2="271" y2="192" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="309" y1="128" x2="299" y2="192" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="337" y1="128" x2="327" y2="199.89473684210526" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="365" y1="128" x2="355" y2="236.73684210526315" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="393" y1="128" x2="383" y2="242" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="421" y1="128" x2="411" y2="242" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="449" y1="128" x2="439" y2="242" stroke-width="1.5" stroke-dasharray="7 5"></line><line class="f-s4-line" x1="477" y1="128" x2="467" y2="207.875" stroke-width="1.5" stroke-dasharray="7 5"></line><path class="f-cool-wash" d="M349.88,234L359,246H441L450.14285714285717,234Z"></path><line class="f-cool-line" x1="349.88" x2="450.14285714285717" y1="234" y2="234" stroke-width="2"></line><rect class="f-soft" x="357" y="241" width="86" height="5" rx="1"></rect><text class="f-note" x="273" y="116">acid clouds rain out</text><g><g aria-hidden="true"><text class="f-note f-num f-halo" x="400.0114285714286" y="226" text-anchor="middle" stroke-width="7">liquid CO₂</text></g><text class="f-note f-num" x="400.0114285714286" y="226" text-anchor="middle">liquid CO₂</text></g><g><text class="f-note f-num" x="275" y="296" text-anchor="start">Acid rain falls on the dust, and</text><text class="f-note f-num" x="275" y="310.5" text-anchor="start">liquid CO₂ washes the SO₂ down.</text><text class="f-note f-num" x="275" y="325" text-anchor="start">Each CaO takes up one SO₂,</text><text class="f-note f-num" x="275" y="339.5" text-anchor="start">leaving gypsum and anhydrite.</text></g><g><rect class="f-axis" x="510" y="36" width="234" height="336" rx="8"></rect><circle class="f-accent" cx="530" cy="58" r="9"></circle><text class="f-surface" x="530" y="58" dy="0.35em" text-anchor="middle" font-weight="700" font-size="11.5">3</text><text class="f-label" x="546" y="62" font-weight="600">The oceans</text><text class="f-note f-num" x="546" y="77">from October 2036</text><path class="f-muted-wash" d="M511.0,196.0L568.0,196.0L606.0,246.0L688.0,246.0L720.0,204.0L743.0,204.0L743,270L511,270Z"></path><path class="f-ink-line" d="M511.0,196.0L568.0,196.0L606.0,246.0L688.0,246.0L720.0,204.0L743.0,204.0" stroke-width="1.5"></path></g><path class="f-s1-wash" d="M580.16,212L606,246H688L713.9047619047619,212Z"></path><line class="f-s1-line" x1="580.16" x2="713.9047619047619" y1="212" y2="212" stroke-width="2"></line><path class="f-soft-line" d="M574.1,204.0L606.0,244.0L688.0,244.0L720.0,204.0" stroke-width="4" stroke-linejoin="round"></path><text class="f-note" x="647.0323809523809" y="237" text-anchor="middle">ocean</text><g><g aria-hidden="true"><text class="f-note f-num f-halo" x="730" y="186" text-anchor="end" stroke-width="7">basalt shores</text></g><text class="f-note f-num" x="730" y="186" text-anchor="end">basalt shores</text></g><g><path d="M528,101L535,108L528,115L521,108Z" class="f-surface"></path><path d="M528,101L535,108L528,115L521,108Z" class="f-accent-line" stroke-width="2" stroke-linejoin="round"></path></g></g><a href="/technologies/genesis" aria-label="Gate: pH above 7.5 for 90 d before any life is released; Genesis seeding from January 2037"><g aria-hidden="true"><g><text class="f-label" x="542" y="111" text-anchor="start">Gate: pH above 7.5</text><text class="f-note f-num" x="542" y="125.5" text-anchor="start">for 90 d before any life;</text><text class="f-note f-num" x="542" y="140" text-anchor="start">Genesis from January 2037</text></g></g><rect class="f-node" x="536" y="96" width="173.00000000000003" height="50" rx="5" fill="none" pointer-events="all"></rect></a><g aria-hidden="true"><g><text class="f-note f-num" x="522" y="296" text-anchor="start">Basalt on the shores and the sea</text><text class="f-note f-num" x="522" y="310.5" text-anchor="start">floor holds the water between</text><text class="f-note f-num" x="522" y="325" text-anchor="start">pH 7.5 and 8.</text></g><text class="f-title" x="16" y="398">The masses, to scale</text><g><text class="f-label" x="224" y="428" text-anchor="end">SO₂ in the air</text><text class="f-note f-num" x="224" y="442" text-anchor="end">150 ppm, 1.7 × 10¹⁸ mol</text><path class="f-s4" d="M236,424h39.41366335574299a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-39.41366335574299Z"><title>SO₂ in the air: 1.1 × 10¹⁷ kg</title></path><text class="f-num" x="287.413663355743" y="432" dy="0.32em">1.1 × 10¹⁷ kg</text></g><g><text class="f-label" x="224" y="462" text-anchor="end">Lime to take it up</text><text class="f-note f-num" x="224" y="476" text-anchor="end">one CaO for each SO₂</text><path class="f-muted" d="M236,458h34a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-34Z"><title>Lime to take it up: 9.3 × 10¹⁶ kg</title></path><text class="f-num" x="282" y="466" dy="0.32em">9.3 × 10¹⁶ kg</text></g><g><text class="f-label" x="224" y="496" text-anchor="end">Basalt carrying it</text><text class="f-note f-num" x="224" y="510" text-anchor="end">10% of basalt is lime</text><path class="f-soft" d="M236,492h376a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-376Z"><title>Basalt carrying it: 9 × 10¹⁷ kg</title></path><text class="f-num" x="624" y="500" dy="0.32em">9 × 10¹⁷ kg</text></g><line class="f-axis" x1="236" x2="236" y1="418" y2="514"></line></g><a href="/technologies/cryo" aria-label="An upper bound: sulfur sealed in the cryo-continents needs no lime."><g aria-hidden="true"><text class="f-note" x="236" y="544">An upper bound: sulfur sealed in the cryo-continents needs no lime.</text></g><rect class="f-node" x="230" y="531" width="443.48" height="18" rx="5" fill="none" pointer-events="all"></rect></a></svg>
