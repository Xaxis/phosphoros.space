.fig .f-halo{fill:none;stroke:var(--f-surface);stroke-linejoin:round}</style><rect width="100%" height="100%" rx="12" class="f-surface"/><title id="acid-sweep-t">Acid Sweep: the sulfur&#x27;s path out of the air and the oceans</title><desc id="acid-sweep-d">Three schematic cross-sections of a highland and a lowland basin. From May 2033, mills grind 6 × 10¹⁵ kg of basalt and canopy drones lay it 6.3 mm deep on the land outside the basins. By July 2034 the acid clouds have rained out onto it and lime turns the acid to gypsum, while the SO₂ dissolves in the liquid CO₂ and freezes with it under the caps: 1.1 × 10¹⁷ kg of it. From September 2036, shore basalt holds the oceans between pH 7.5 and 8; no life is released until they stay above 7.5 for 90 d. Below, the masses to scale.</desc><g aria-hidden="true"><text class="f-title" x="16" y="22">The sulfur&#x27;s path, step by step</text><g><rect class="f-axis" x="585.1" y="8" width="158.9" height="18" rx="9"></rect><text class="f-note" x="664.5500000000001" y="20.5" text-anchor="middle">Schematic, not to scale</text></g><g><rect class="f-axis" x="16" y="36" width="234" height="336" rx="8"></rect><circle class="f-accent" cx="36" cy="58" r="9"></circle><text class="f-surface" x="36" y="58" dy="0.35em" text-anchor="middle" font-weight="700" font-size="11.5">1</text><text class="f-label" x="52" y="62" font-weight="600">Grind and dust</text><text class="f-note f-num" x="52" y="77">from May 2033</text><path class="f-muted-wash" d="M17.0,196.0L74.0,196.0L112.0,246.0L194.0,246.0L226.0,204.0L249.0,204.0L249,270L17,270Z"></path><path class="f-ink-line" d="M17.0,196.0L74.0,196.0L112.0,246.0L194.0,246.0L226.0,204.0L249.0,204.0" stroke-width="1.5"></path></g><rect class="f-s4-wash" x="17" y="100" width="232" height="24"></rect><text class="f-note" x="26" y="116">acid clouds</text><g><line class="f-soft-line" x1="66" y1="155" x2="57" y2="189" stroke-dasharray="1 3"></line><line class="f-soft-line" x1="66" y1="155" x2="66" y2="189" strok