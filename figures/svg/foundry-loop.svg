99999999999994" text-anchor="start" font-weight="600">Lithocells</text><text class="f-note" x="579.453792062852" y="332.99999999999994" text-anchor="start">Chips</text></g><g><title>Choir nodes: make compute and links for coordination, the mass ledger.</title><circle class="f-accent f-ring" cx="487" cy="372.29611541307906" r="7"></circle><text class="f-label" x="496" y="383.15252187363006" text-anchor="start" font-weight="600">Choir nodes</text><text class="f-note" x="496" y="398.15252187363006" text-anchor="start">Compute and links</text></g><g><title>Coil lines: make motors for everything that moves.</title><circle class="f-accent f-ring" cx="380" cy="394" r="7"></circle><text class="f-label" x="380" y="418" text-anchor="middle" font-weight="600">Coil lines</text><text class="f-note" x="380" y="433" text-anchor="middle">Motors</text></g><g><title>Rolling mills: make sheet, beam and rail for assemblers, mass drivers, petal and slat frames.</title><circle class="f-accent f-ring" cx="273" cy="372.29611541307906" r="7"></circle><text class="f-label" x="264" y="383.15252187363006" text-anchor="end" font-weight="600">Rolling mills</text><text class="f-note" x="264" y="398.15252187363006" text-anchor="end">Sheet, beam and rail</text></g><g><title>Mass drivers: make parts to orbit for the lattice, the veil, the ring.</title><circle class="f-accent f-ring" cx="194.67056359013017" cy="313.00000000000006" r="7"></circle><text class="f-label" x="180.54620793714804" y="318.00000000000006" text-anchor="end" font-weight="600">Mass drivers</text><text class="f-note" x="180.54620793714804" y="333.00000000000006" text-anchor="end">Parts to orbit</text></g><g><title>Haulers: make site transport for the whole loop.</title><circle class="f-accent f-ring" cx="166" cy="232.00000000000003" r="7"></circle><text class="f-label" x="150" y="229.00000000000003" text-anchor="end" font-weight="600">Haulers</text><text class="f-note" x="150" y="244.00000000000003" text-anchor="end">Site transport</text></g><g><title>Printers: make complex metal parts for assemblers, bearings, housings.</title><circle class="f-accent f-ring" cx="194.67056359013014" cy="151" r="7"></circle><text class="f-label" x="180.546207937148" y="140" text-anchor="end" font-weight="600">Printers</text><text class="f-note" x="180.546207937148" y="155" text-anchor="end">Complex metal parts</text></g><g><title>Assemblers: make every machine type for the whole loop.</title><circle class="f-accent f-ring" cx="272.9999999999999" cy="91.70388458692099" r="7"></circle><text class="f-label" x="263.9999999999999" y="74.84747812636998" text-anchor="end" font-weight="600">Assemblers</text><text class="f-note" x="263.9999999999999" y="89.84747812636998" text-anchor="end">Every machine type</text></g><text class="f-note" x="380" y="186" text-anchor="middle">The loop doubles every</text><text class="f-title f-num" x="380" y="236" text-anchor="middle" font-size="44">60 d</text><text class="f-label" x="380" y="266" text-anchor="middle">12 machine types make all 12</text><text class="f-note f-num" x="380" y="284" text-anchor="middle">27 doublings take the 1,000 t seed to 1.3 × 10¹⁴ kg</text></svg>
