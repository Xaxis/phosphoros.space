.fig a:focus-visible .f-node{stroke-width:3}</style><rect width="100%" height="100%" rx="12" class="f-surface"/><title id="energy-sankey-t">Energy flows of the Phosphoros campaign, to the deadline</title><desc id="energy-sankey-d">Sunlight 5.2 × 10²⁸ J reaches the Lattice; it delivers 7.8 × 10²⁷ J. The Ring recovers 5.3 × 10²⁷ J from the falling ice and pays the Railheads back. The Exhaust throws 4.1 × 10²⁷ J into space as light.</desc><g><rect class="f-accent" x="24" y="9" width="10" height="10" rx="2"></rect><text x="40" y="14" dy="0.32em">Sunlight and electricity</text></g><g><rect class="f-s1" x="202" y="9" width="10" height="10" rx="2"></rect><text x="218" y="14" dy="0.32em">Motion of the ice</text></g><g><rect class="f-hot" x="336" y="9" width="10" height="10" rx="2"></rect><text x="352" y="14" dy="0.32em">Venus&#x27;s heat, and light to space</text></g><g><rect class="f-muted" x="576" y="9" width="10" height="10" rx="2"></rect><text x="592" y="14" dy="0.32em">Waste heat</text></g><path class="f-accent-line" d="M24,358.7809810531576H118" stroke-width="208" stroke-opacity="0.55"><title>Sunlight on the Lattice&#x27;s film: 5.2 × 10²⁸ J</title></path><path class="f-muted-line" d="M126,374.12425829356954H258" stroke-width="176.79999999999998" stroke-opacity="0.4"><title>Waste heat from the film, lasers and receivers: 4.4 × 10²⁸ J</title></path><path class="f-accent-line" d="M126,463.0242582935696H272" stroke-width="1" stroke-opacity="0.55"><title>Warming 3.8 × 10²⁵ J, oxygen 2.7 × 10²⁵ J, hardware 10²² J</title></path><path class="f-accent-line" d="M126,258.83810424428265C213,258.83810424428265 213,116.3422283632915 300,116.3422283632915" stroke-width="8.114246382250204" stroke-opacity="0.55"><title>Lattice to the Railheads, before the first catch: 2.0 × 10²⁷ J</title></path><path class="f-accent-line" d="M126,267.2969873457397H604" stroke-width="8.803519820663876" stroke-opacity="0.55"><title>Lattice energy left over: 2.2 × 10²⁷ J</title></path><path class="f-acc