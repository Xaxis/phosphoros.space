.fig .f-halo{fill:none;stroke:var(--f-surface);stroke-linejoin:round}</style><rect width="100%" height="100%" rx="12" class="f-surface"/><title id="research-gates-t">The proof experiments and their gates, 2027 and 2028</title><desc id="research-gates-d">9 experiments run in parallel from 2027, each with a pass mark and a kill signal, and must pass by 31 December 2028. The cloud-life gate falls just before.</desc><g aria-hidden="true"><rect class="f-s1" x="16" y="12" width="22" height="10" rx="3"></rect><text x="44" y="17" dy="0.32em">Proof experiment</text><rect class="f-accent" x="168" y="12" width="22" height="10" rx="3"></rect><text x="196" y="17" dy="0.32em">Cloud-life survey, the gate on the whole program</text><g><line class="f-grid" x1="196" x2="196" y1="120" y2="630"></line><text class="f-tick" x="325.04516129032254" y="116" text-anchor="middle">2027</text><text class="f-tick" x="325.04516129032254" y="648" text-anchor="middle">2027</text><line class="f-grid" x1="454.09032258064514" x2="454.09032258064514" y1="120" y2="630"></line><text class="f-tick" x="583.4890322580645" y="116" text-anchor="middle">2028</text><text class="f-tick" x="583.4890322580645" y="648" text-anchor="middle">2028</text><line class="f-grid" x1="712.8877419354839" x2="712.8877419354839" y1="120" y2="630"></line><text class="f-tick" x="728.443870967742" y="116" text-anchor="middle">2029</text><text class="f-tick" x="728.443870967742" y="648" text-anchor="middle">2029</text></g><line class="f-axis" x1="196" x2="744" y1="630" y2="630"></line></g><g><a href="/technologies/ouroboros" aria-label="Ouroboros-0 (Earth), 1 January 2027 to 31 December 2028: proves a factory that builds itself from simulated Mercury regolith and simulated Ceres rock."><g aria-hidden="true"><g><title>Ouroboros-0 (Earth), 1 January 2027 to 31 December 2028: proves a factory that builds itself from simulated Mercury regolith and simulated Ceres rock.</title><text class="f-label" x="16" y="143" font-weight="600">Ouroboros-0</text><rect class="f-s1 f-node" x="196" y="134" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="159">Earth</text><text class="f-note" x="16" y="174" font-style="italic">No substitute</text><text x="196" y="160"><tspan class="f-label" font-weight="600">Pass </tspan>95% mass closure, doubling in under 120 d</text><text x="196" y="175"><tspan class="f-label" font-weight="600">Kill </tspan>Under 70% closure</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="182" y2="182"></line><a href="/technologies/exhaust" aria-label="Exhaust-1 (Laboratory), 1 January 2027 to 31 December 2028: proves electroluminescent cooling at useful power."><g aria-hidden="true"><g><title>Exhaust-1 (Laboratory), 1 January 2027 to 31 December 2028: proves electroluminescent cooling at useful power.</title><text class="f-label" x="16" y="199" font-weight="600">Exhaust-1</text><rect class="f-s1 f-node" x="196" y="190" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="215">Laboratory</text><text class="f-note" x="16" y="230" font-style="italic">No substitute</text><text x="196" y="216"><tspan class="f-label" font-weight="600">Pass </tspan>10 kW/m² of net cooling, at 100% of the Carnot limit or better, with light in a band and cone the air above the canopies lets through</text><text x="196" y="231"><tspan class="f-label" font-weight="600">Kill </tspan>No net cooling above 100 W/m²</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="238" y2="238"></line><a href="/technologies/helios" aria-label="Lightpipe (Low Earth orbit), 1 January 2027 to 31 December 2028: proves coherent power beaming."><g aria-hidden="true"><g><title>Lightpipe (Low Earth orbit), 1 January 2027 to 31 December 2028: proves coherent power beaming.</title><text class="f-label" x="16" y="255" font-weight="600">Lightpipe</text><rect class="f-s1 f-node" x="196" y="246" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="271">Low Earth orbit</text><text x="196" y="272"><tspan class="f-label" font-weight="600">Pass </tspan>1 MW over 1,000 km between satellites at 30% end to end</text><text x="196" y="287"><tspan class="f-label" font-weight="600">Kill </tspan>Phase lock fails beyond 100 emitters</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="294" y2="294"></line><a href="/technologies/veil" aria-label="Veil-1 (Orbit), 1 January 2027 to 31 December 2028: proves an electrochromic slat."><g aria-hidden="true"><g><title>Veil-1 (Orbit), 1 January 2027 to 31 December 2028: proves an electrochromic slat.</title><text class="f-label" x="16" y="311" font-weight="600">Veil-1</text><rect class="f-s1 f-node" x="196" y="302" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="327">Orbit</text><text x="196" y="328"><tspan class="f-label" font-weight="600">Pass </tspan>A 1 km² slat in orbit dims from clear to 99% blocked and holds its attitude</text><text x="196" y="343"><tspan class="f-label" font-weight="600">Kill </tspan>The film degrades within 6 months</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="350" y2="350"></line><a href="/technologies/ice-train" aria-label="Railhead (Earth), 1 January 2027 to 31 December 2028: proves an ice mass driver."><g aria-hidden="true"><g><title>Railhead (Earth), 1 January 2027 to 31 December 2028: proves an ice mass driver.</title><text class="f-label" x="16" y="367" font-weight="600">Railhead</text><rect class="f-s1 f-node" x="196" y="358" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="383">Earth</text><text x="196" y="384"><tspan class="f-label" font-weight="600">Pass </tspan>1 t of ice at 3 km/s, 10 shots an hour</text><text x="196" y="399"><tspan class="f-label" font-weight="600">Kill </tspan>Under 1 km/s, or under 1 shot an hour</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="406" y2="406"></line><a href="/technologies/cryo" aria-label="Cryo-seal (Earth), 1 January 2027 to 31 December 2028: proves dry-ice storage under a 288 K sky."><g aria-hidden="true"><g><title>Cryo-seal (Earth), 1 January 2027 to 31 December 2028: proves dry-ice storage under a 288 K sky.</title><text class="f-label" x="16" y="423" font-weight="600">Cryo-seal</text><rect class="f-s1 f-node" x="196" y="414" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="439">Earth</text><text x="196" y="440"><tspan class="f-label" font-weight="600">Pass </tspan>Under 0.16 W/m² of heat leak, what the plan&#x27;s cap gives, for 12 months</text><text x="196" y="455"><tspan class="f-label" font-weight="600">Kill </tspan>The cap cracks under thermal cycling</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="462" y2="462"></line><a href="/technologies/aegis" aria-label="Mini-Aegis (Sun-Earth L1), 1 January 2027 to 31 December 2028: proves a magnetic shield."><g aria-hidden="true"><g><title>Mini-Aegis (Sun-Earth L1), 1 January 2027 to 31 December 2028: proves a magnetic shield.</title><text class="f-label" x="16" y="479" font-weight="600">Mini-Aegis</text><rect class="f-s1 f-node" x="196" y="470" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="495">Sun-Earth L1</text><text x="196" y="496"><tspan class="f-label" font-weight="600">Pass </tspan>A 10 m coil&#x27;s bubble deflects the solar wind</text><text x="196" y="511"><tspan class="f-label" font-weight="600">Kill </tspan>Repeated quenches</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="518" y2="518"></line><g aria-hidden="true"><g><title>Cloud-life survey (Venus), 1 June 2027 to 1 December 2028: proves no native life will be harmed.</title><text class="f-label" x="16" y="535" font-weight="600">Cloud-life survey</text><rect class="f-accent f-node" x="302.7716129032258" y="526" width="388.1961290322581" height="10" rx="3"></rect></g></g><g aria-hidden="true"><text class="f-note" x="16" y="551">Venus</text><text class="f-note" x="16" y="566" font-style="italic">Stops the whole program</text><text x="196" y="552"><tspan class="f-label" font-weight="600">Pass </tspan>Balloon and droplet sample return show no biology</text><text x="196" y="567"><tspan class="f-label" font-weight="600">Kill </tspan>A credible biosignature: the whole program stops</text></g></g><g><line class="f-grid" x1="16" x2="744" y1="574" y2="574"></line><a href="/technologies/choir" aria-label="Choir-sim (Earth), 1 January 2027 to 31 December 2028: proves fleet autonomy."><g aria-hidden="true"><g><title>Choir-sim (Earth), 1 January 2027 to 31 December 2028: proves fleet autonomy.</title><text class="f-label" x="16" y="591" font-weight="600">Choir-sim</text><rect class="f-s1 f-node" x="196" y="582" width="516.1806451612903" height="10" rx="3"></rect></g></g></a><g aria-hidden="true"><text class="f-note" x="16" y="607">Earth</text><text x="196" y="608"><tspan class="f-label" font-weight="600">Pass </tspan>10,000 robots run a factory for 90 d unattended</text><text x="196" y="623"><tspan class="f-label" font-weight="600">Kill </tspan>More than 1 human intervention a day</text></g></g><g aria-hidden="true"><g><title>Seed lands on Mercury: 14 January 2029</title><line class="f-muted-line" stroke-width="1" stroke-dasharray="3 3" x1="722.0799999999999" x2="722.0799999999999" y1="45" y2="630"></line><text x="716.0799999999999" y="40" text-anchor="end"><tspan class="f-label">Seed lands on Mercury</tspan><tspan class="f-note f-num">, 14 January 2029</tspan></text></g><g><title>Every experiment must pass: 31 December 2028</title><line class="f-ink-line" stroke-width="2" x1="712.1806451612903" x2="712.1806451612903" y1="62" y2="630"></line><text x="706.1806451612903" y="57" text-anchor="end"><tspan class="f-label">Every experiment must pass</tspan><tspan class="f-note f-num">, 31 December 2028</tspan></text></g><g><title>Gate: no native life: 15 December 2028</title><line class="f-accent-line" stroke-width="2" x1="700.8670967741936" x2="700.8670967741936" y1="79" y2="630"></line><text x="694.8670967741936" y="74" text-anchor="end"><tspan class="f-label">Gate: no native life</tspan><tspan class="f-note f-num">, 15 December 2028</tspan></text></g><g><title>Seed foundry launches: 1 October 2028</title><line class="f-muted-line" stroke-width="1" stroke-dasharray="3 3" x1="647.8348387096773" x2="647.8348387096773" y1="96" y2="630"></line><text x="641.8348387096773" y="91" text-anchor="end"><tspan class="f-label">Seed foundry launches</tspan><tspan class="f-note f-num">, 1 October 2028</tspan></text></g><text class="f-note" x="16" y="674">No substitute: if this line fails, the plan falls back to the multi-century route.</text></g></svg>
